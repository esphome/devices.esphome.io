name: Request Copilot review

# Requests a Copilot code review whenever a ready pull request is opened,
# pushed to or marked ready for review. The ruleset reviews these too, but it
# runs the review as the PR author (or whoever marked it ready), so a
# contributor without Copilot access gets none. GitHub only acts on a request
# from an account with a Copilot seat (GITHUB_TOKEN and app requests are
# accepted and then ignored), so this uses esphome-review-bot's token.
# COPILOT_REVIEW_TOKEN is a fine-grained token of that account (Pull requests
# read and write on this repo) and expires: when it is rejected the run fails,
# and an org owner signs in as the bot, creates a new one and replaces the secret.
# Drafts the Made for ESPHome promotion marks ready use GITHUB_TOKEN, whose
# events trigger no workflow, so made-for-esphome-pr.yml requests those.
# Logic lives in .github/scripts/request-copilot-review.cjs.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  request:
    name: Request Copilot review
    runs-on: ubuntu-latest
    # Bot PRs (Dependabot) get no repo secrets, and drafts are not reviewed.
    if: >-
      github.event.pull_request.user.type != 'Bot'
      && !github.event.pull_request.draft
    permissions:
      contents: read  # to check out the script below
    steps:
      # Checks out the base repo (trusted) only to load the script below,
      # never the PR's code - this job holds the review bot's token.
      - name: Checkout scripts
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Request Copilot review
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.COPILOT_REVIEW_TOKEN }}
          script: |
            const script = require('./.github/scripts/request-copilot-review.cjs');
            await script({ github, context, core });
