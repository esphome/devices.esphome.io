name: Merge conflicts

# Keeps the `has-conflicts` label and a "Merge conflicts" check run on each
# pull request's head commit in sync with whether it merges cleanly into its
# base. The check run is published explicitly because a pull_request_target
# job's own check attaches to the base commit, not the PR head; this job never
# fails, so the head check carries the signal.
#
# - pull_request_target (opened / reopened / synchronize, or edited to a new
#   base): checks that PR.
# - push to main: rechecks every open PR against main, since a merge can
#   create (or clear) a conflict in a PR nobody touched.
#
# When the head check changes on a made-for-esphome PR, the job re-runs its
# promotion (mfe-promote.cjs), which otherwise only runs after CI or the review.
#
# Logic lives in .github/scripts/merge-conflicts.cjs.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  push:
    branches:
      - main

permissions: {}

jobs:
  sync:
    name: Sync conflict label and check
    runs-on: ubuntu-latest
    # `edited` also fires for title and body edits; only a base change matters.
    if: github.event.action != 'edited' || github.event.changes.base
    # A newer run rereads every state it needs, so the older one can be
    # dropped. Job-level, so a skipped title or body edit cancels nothing.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      checks: write  # publish the "Merge conflicts" check run on the PR head
      contents: read  # to check out the script below
      issues: write  # labels are an issues-level resource
      pull-requests: write  # read mergeability, set labels, re-run the Made for ESPHome promotion
    steps:
      # Checks out the base repo (trusted) only to load the script below,
      # never the PR's code - this job runs with a writable token.
      - name: Checkout scripts
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Sync has-conflicts label and check
        id: sync
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const script = require('./.github/scripts/merge-conflicts.cjs');
            await script({ github, context, core });

      # A promotion marks drafts ready with GITHUB_TOKEN, whose event starts no
      # workflow, so ask Copilot here with the app token. This also runs after
      # a failed sweep, for the PRs it promoted before failing.
      - name: Generate a token
        if: ${{ !cancelled() && steps.sync.outputs.marked-ready }}
        id: generate-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.ESPHOME_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.ESPHOME_GITHUB_APP_PRIVATE_KEY }}

      - name: Request Copilot reviews
        if: ${{ !cancelled() && steps.sync.outputs.marked-ready }}
        uses: actions/github-script@v9.0.0
        env:
          PR_NUMBERS: ${{ steps.sync.outputs.marked-ready }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const { requestCopilotReviews } = require('./.github/scripts/request-copilot-review.cjs');
            await requestCopilotReviews({
              github,
              core,
              ...context.repo,
              prNumbers: process.env.PR_NUMBERS,
            });
