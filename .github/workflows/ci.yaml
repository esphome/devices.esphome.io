---
name: CI

on:
  push:
  pull_request:

concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown_lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: markdownlint-cli
        uses: nosborn/github-action-markdown-cli@v3.5.0
        with:
          config_file: ".markdownlintrc"
          files: src
  yaml_lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: yamllint-cli
        uses: "docker://pipelinecomponents/yamllint:latest"
        with:
          args: yamllint -c .yamllintrc .
  frontmatter_lint:
    name: Frontmatter YAML Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint frontmatter in changed markdown
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run --silent lint-frontmatter -- --annotations
  line_endings:
    name: Line Endings Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Check for CRLF line endings
        run: |
          echo "Checking for files with CRLF line endings..."

          # Find all text files (excluding .git directory and node_modules)
          files_with_crlf=$(find . -type f \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            \( \
              -name "*.md" -o -name "*.yml" -o -name "*.yaml" \
              -o -name "*.json" -o -name "*.py" -o -name "*.sh" \
              -o -name "*.js" -o -name "*.ts" \
            \) \
            -exec file {} \; | grep "CRLF" || true)

          if [ -n "$files_with_crlf" ]; then
            echo "❌ ERROR: Found files with CRLF line endings:"
            echo "$files_with_crlf"
            echo ""
            echo "Please convert these files to use LF line endings."
            echo "You can use: sed -i 's/\r$//' <file>"
            echo "Or configure your editor to use LF line endings (see .editorconfig)"
            exit 1
          else
            echo "✅ All files have correct LF line endings"
          fi
  yaml_validate:
    name: YAML Config Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Need history for the new-page diff (PRs only); shallow is fine
          # for push events but harmless to fetch full depth here.
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate referenced yaml configs
        env:
          # On pull_request events these populate the "newly-added page"
          # check that forbids inline yaml on new device pages. Push events
          # leave them empty, so the inline-yaml rule is skipped there.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # On failure the validator writes a markdown report here; the
          # pr-validation-feedback workflow turns it into a REQUEST_CHANGES
          # review on the PR.
          VALIDATION_REPORT: ${{ github.workspace }}/validation-report.md
        run: npm run --silent validate-yaml
      - name: Record PR number for feedback
        # Always (even on failure) so the follow-up workflow can resolve the
        # PR — workflow_run payloads omit the PR number for forks.
        if: always() && github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt
      - name: Upload validation feedback
        # Upload on every PR run. When the validator passes there is no
        # report file (if-no-files-found: ignore) and only pr-number.txt is
        # uploaded, which signals the feedback workflow to dismiss any stale
        # review.
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: validation-report
          path: |
            pr-number.txt
            validation-report.md
          if-no-files-found: ignore
          retention-days: 1
  esphome_validate:
    name: ESPHome Config Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    # SECURITY: `esphome config` and the Device Builder importer run the PR's
    # yaml, and `external_components` / `packages` are fetched and imported
    # while it validates. This job only runs in the secret-free `pull_request`
    # context with `contents: read`, never runs `compile` / `run`, has no
    # secrets file, and stays separate from yaml_validate so it cannot touch
    # that job's artifact.
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # esphome/device-builder commit whose importer
      # (script/sync_esphome_devices.py --check) decides whether a page
      # imports. Bump it to a newer device-builder main commit to pick up
      # importer changes; ESPHome is the latest stable release that commit's
      # `esphome` extra accepts, shared by both checks.
      DEVICE_BUILDER_REF: 302899f8f81cd86a7ec11c2115c5122c8eba6ffb
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Commits and trees only: the diff needs no file contents, and only
          # the changed device folders are added to the sparse checkout below.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            src/lib
          persist-credentials: false
      - name: Find changed device pages with file= configs
        id: scope
        run: |
          dirs=""
          for d in $(git diff --name-only --diff-filter=ACMRTD "$BASE_SHA...$HEAD_SHA" -- src/docs/devices \
              | sed -n 's|^src/docs/devices/\([^/]*\)/.*|\1|p' | sort -u); do
            if git show "HEAD:src/docs/devices/$d/index.md" 2>/dev/null | grep -q 'file='; then
              dirs="$dirs $d"
            fi
          done
          if [ -z "$dirs" ]; then
            echo "No changed device pages with file= configs."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Checking:$dirs"
          # shellcheck disable=SC2086
          git sparse-checkout add $(printf 'src/docs/devices/%s ' $dirs)
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci
      - name: Checkout Device Builder
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: esphome/device-builder
          ref: ${{ env.DEVICE_BUILDER_REF }}
          path: _device-builder
          persist-credentials: false
      - name: Setup uv
        if: steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: _device-builder/pyproject.toml
      - name: Install Device Builder and ESPHome
        if: steps.scope.outputs.run == 'true'
        run: |
          uv venv "$RUNNER_TEMP/venv" --python 3.12
          # Stable releases only: uv otherwise takes an ESPHome beta that
          # satisfies the floor.
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" --prerelease disallow \
            "./_device-builder[esphome]"
          "$RUNNER_TEMP/venv/bin/esphome" version
      - name: Validate with ESPHome and the Device Builder importer
        if: steps.scope.outputs.run == 'true'
        env:
          DIRS: ${{ steps.scope.outputs.dirs }}
          DEVICE_BUILDER_DIR: ${{ github.workspace }}/_device-builder
          DEVICE_BUILDER_PYTHON: ${{ runner.temp }}/venv/bin/python
          ESPHOME_BIN: ${{ runner.temp }}/venv/bin/esphome
          # On failure the validator writes a markdown report here; the
          # pr-validation-feedback workflow adds it to its review.
          VALIDATION_REPORT: ${{ github.workspace }}/esphome-validation-report.md
        # shellcheck disable=SC2086
        run: npm run --silent validate-esphome -- --annotations $DIRS
      - name: Upload validation feedback
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: esphome-validation-report
          path: esphome-validation-report.md
          if-no-files-found: ignore
          retention-days: 1
  link_check:
    name: External Link Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check external links in changed markdown
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run --silent check-links -- --annotations
