time:
  - platform: homeassistant
    id: time_homeassistant

interval:
  - interval: 5s
    then:
      - script.execute: time_update

  - interval: 0.05s
    then:
      - animation.next_frame: my_animation
      - lvgl.image.update:
          id: img_id
          src: my_animation

script:
  - id: time_update
    then:
      - lvgl.indicator.update:
          id: minute_hand
          value: !lambda |-
            return id(time_homeassistant).now().minute;
      - lvgl.indicator.update:
          id: hour_hand
          value: !lambda |-
            auto now = id(time_homeassistant).now();
            return std::fmod(now.hour, 12) * 60 + now.minute;
      - lvgl.label.update:
          id: date_label
          text: !lambda |-
            static const char * const mon_names[] =
                {"JAN", "FEB", "MAR", "APR", "MAI", "JUN",
                "JUL", "AUG", "SEP", "OKT", "NOV", "DEZ"};
            static const char * const day_names[] =
                {"SO", "MO", "DI", "MI", "DO", "FR", "SA"};
            static char date_buf[16];
            auto now = id(time_homeassistant).now();
            snprintf(date_buf, sizeof(date_buf), "%s,%2d.%s",
                day_names[now.day_of_week-1], now.day_of_month, mon_names[now.month-1]);
            return date_buf;
      - lvgl.label.update:
          id: time_label
          text: !lambda |-
            static char date_buf[16];
            auto now = id(time_homeassistant).now();
            snprintf(date_buf, sizeof(date_buf), "%d:%02d",now.hour, now.minute);
            return date_buf;

lvgl:
  log_level: INFO
  color_depth: 16
  bg_color: 0x000000
  text_font: montserrat_30
  align: center

  style_definitions:
    - id: date_style
      text_font: montserrat_40
      align: center
      text_color: 0xFFFFFF
      bg_opa: cover
      bg_color: 0x3f3f3f
      radius: 4
      pad_all: 2

  pages:
    - id: clock_page
      widgets:
        - meter:
            height: 480
            width: 480
            align: center
            bg_opa: TRANSP
            text_color: 0xFFFFFF
            scales:
              - ticks:
                  width: 1
                  count: 61
                  length: 10
                  color: 0xFFFFFF
                range_from: 0
                range_to: 60
                angle_range: 360
                rotation: 270
                indicators:
                  - line:
                      id: minute_hand
                      width: 5
                      color: 0xE0E0E0
                      r_mod: -1
              - angle_range: 330
                rotation: 300
                range_from: 1
                range_to: 12
                ticks:
                  width: 1
                  count: 12
                  length: 1
                  major:
                    stride: 1
                    width: 4
                    length: 8
                    color: 0xC0C0F0
                    label_gap: 20

              - angle_range: 360
                rotation: 270
                range_from: 0
                range_to: 720
                indicators:
                  - line:
                      id: hour_hand
                      width: 8
                      color: 0xF0A0A0
                      r_mod: -20

        - label:
            styles: date_style
            id: date_label
            text_font: montserrat_40
            y: -40
        - label:
            id: time_label
            styles: date_style
            y: 40

        - button:
            align: CENTER
            y: 120
            width: 100
            height: 40
            id: btn_id
            checkable: true
            widgets:
              - label:
                  align: center
                  text: "??"
            on_short_click:
              then:
                - lvgl.page.show: animation_page

    - id: animation_page
      widgets:
        - image:
            align: CENTER
            src: my_animation
            id: img_id
            radius: 480
            clip_corner: true
            on_short_click:
              then:
                - lvgl.page.show: clock_page

animation:
  - file: "demo.webp"
    id: my_animation
    resize: 400x400
    type: RGB565
