substitutions:
  device_name: touchdisplay1

esphome:
  name: $device_name
  on_boot:
    - output.turn_on: backlight

psram:
  mode: octal
  speed: 80MHz

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

sensor:

  - platform: wifi_signal
    name: "$device_name WiFi Signal"
    id: sensor_wifi
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: uptime
    id: uptime_sensor
    name: "$device_name Uptime"
    update_interval: 15s
    entity_category: "diagnostic"

spi:
  mosi_pin: GPIO47
  clk_pin: GPIO48

display:
  - platform: st7701s
    color_order: RGB
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    data_rate: 40MHz

    data_pins:
      - 46
      - 9
      - 10
      - 11
      - 12
      - 13
      - 14
      - 0
      - 4
      - 5
      - 6
      - 7
      - 15
      - 8
      - 20
      - 3

    init_sequence:
      - [0x01]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xC0, 0x3B, 0x00]
      - [0xC1, 0x0D, 0x02]
      - [0xC2, 0x31, 0x05]
      # This differs from the standard init sequence.
      # We need to set MDT=0.
      - [0xCD, 0x00]
      - [0xB0, 0x00, 0x11, 0x18, 0x0E, 0x11, 0x06, 0x07, 0x08, 0x07, 0x22, 0x04, 0x12, 0x0F, 0xAA, 0x31, 0x18]
      - [0xB1, 0x00, 0x11, 0x19, 0x0E, 0x12, 0x07, 0x08, 0x08, 0x08, 0x22, 0x04, 0x11, 0x11, 0xA9, 0x32, 0x18]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x60]
      - [0xB1, 0x32]
      - [0xB2, 0x07]
      - [0xB3, 0x80]
      - [0xB5, 0x49]
      - [0xB7, 0x85]
      - [0xB8, 0x21]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xE0, 0x00, 0x1B, 0x02]
      - [0xE1, 0x08, 0xA0, 0x00, 0x00, 0x07, 0xA0, 0x00, 0x00, 0x00, 0x44, 0x44]
      - [0xE2, 0x11, 0x11, 0x44, 0x44, 0xED, 0xA0, 0x00, 0x00, 0xEC, 0xA0, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x11]
      - [0xE4, 0x44, 0x44]
      - [0xE5, 0x0A, 0xE9, 0xD8, 0xA0, 0x0C, 0xEB, 0xD8, 0xA0, 0x0E, 0xED, 0xD8, 0xA0, 0x10, 0xEF, 0xD8, 0xA0]
      - [0xE6, 0x00, 0x00, 0x11, 0x11]
      - [0xE7, 0x44, 0x44]
      - [0xE8, 0x09, 0xE8, 0xD8, 0xA0, 0x0B, 0xEA, 0xD8, 0xA0, 0x0D, 0xEC, 0xD8, 0xA0, 0x0F, 0xEE, 0xD8, 0xA0]
      - [0xEB, 0x02, 0x00, 0xE4, 0xE4, 0x88, 0x00, 0x40]
      - [0xEC, 0x3C, 0x00]
      - [0xED, 0xAB, 0x89, 0x76, 0x54, 0x02, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x20, 0x45, 0x67, 0x98, 0xBA]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xE5, 0xE4]
      - [0x3A, 0x60]

#    show_test_card: true

touchscreen:
  platform: gt911
  id: my_touchscreen
  # interrupt_pin: GPIOXX

i2c:
  scl: GPIO45
  sda: GPIO19

output:
  - platform: ledc
    pin: GPIO38
    id: backlight

switch:  # Relays
  - platform: gpio
    name: "$device_name Relay 1"
    pin: GPIO40
    id: relay1
  - platform: gpio
    name: "$device_name Relay 2"
    pin: GPIO2
    id: relay2
  - platform: gpio
    name: "$device_name Relay 3"
    pin: GPIO1
    id: relay3
