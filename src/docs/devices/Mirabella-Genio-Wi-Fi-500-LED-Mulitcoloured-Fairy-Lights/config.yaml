esphome:
  name: fairy-lights

esp8266:
  board: esp8285

wifi:
  ap: {}

# Enable logging
logger:
output:
  # Specify the two pins of the h-bridge as PWM pins
  - platform: esp8266_pwm
    id: pina
    pin: GPIO12
  - platform: esp8266_pwm
    id: pinb
    pin: GPIO14

  # Specify the pin for the button LED
  - platform: gpio
    id: status_led
    pin: GPIO4

light:
  # Create a light using the hbridge
  - platform: hbridge
    id: mainlight
    name: "Fairy Lights"
    pin_a: pina
    pin_b: pinb

  # Create a light using the LED
  - platform: binary
    name: "LED"
    internal: true
    output: status_led

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
