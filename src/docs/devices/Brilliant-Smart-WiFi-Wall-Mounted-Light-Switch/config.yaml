substitutions:
  device_name: garage-light-switch
  friendly_name: "Light Switch - Garage"

esphome:
  name: ${device_name}

esp8266:
  board: esp01_1m

wifi:
  fast_connect: true
  ap: {}

# Keep the serial port available for the Tuya MCU.
logger:
  baud_rate: 0

uart:
  id: mcu_uart
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 9600

tuya:
  id: tuya_mcu
  uart_id: mcu_uart

switch:
  - platform: tuya
    id: relay_1
    tuya_id: tuya_mcu
    name: "${friendly_name}"
    switch_datapoint: 1
