esphome:
  name: esp32-mos-x4
  friendly_name: ESP32 MOS X4

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ap: {}

binary_sensor:
  - platform: status
    name: Status
  - platform: gpio
    name: IO0 Button
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true

# Each MOSFET output as an on/off switch. For dimming or fan speed control
# see the PWM config further down the page.
switch:
  - platform: gpio
    name: Output 1
    pin: GPIO16
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: Output 2
    pin: GPIO17
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: Output 3
    pin: GPIO26
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: Output 4
    pin: GPIO27
    restore_mode: ALWAYS_OFF

# The red LED: solid when connected, blinks on warnings and errors.
light:
  - platform: status_led
    name: Status LED
    pin: GPIO23
