# Extra entities for the sensor-equipped build (model: AC0651).
#
# Merge these list items into the `sensor:` and `switch:` blocks of config.yaml.
# Do not append this file as-is: config.yaml already defines `sensor:`, and a
# duplicate top-level key would drop the base filter sensors.
sensor:
  - platform: philips
    philips: purifier
    id: philips_pm25
    name: "PM2.5"
    type: pm2_5
  - platform: philips
    philips: purifier
    id: philips_allergen_index
    name: "Allergen Index"
    type: allergen_index

switch:
  - platform: philips
    philips: purifier
    id: philips_standby_sensor
    name: "Standby Sensor Monitoring"
    type: standby_sensor
