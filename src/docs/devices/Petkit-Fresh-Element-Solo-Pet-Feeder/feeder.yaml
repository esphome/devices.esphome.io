# PETKIT Fresh Element Solo (D4): feeding logic, on top of config.yaml.
# Follows the stock firmware: loop counting, jam handling, outlet and hopper IR,
# button gestures, LED, beeps and power checks (see docs/).

substitutions:
  timezone: Europe/Paris
  ntp_server: pool.ntp.org
  default_scoops: "1"
  min_scoops: "0"
  max_scoops: "6"
  # Where the feeder_motor component (the motor controller) comes from.
  feeder_component_source: github://Triskae/esphome-petkit-element-solo@v1.0.0
  # Stock tones: 2 kHz buzzer, b6 is about 1976 Hz.
  beep_short: "short:d=16,o=6,b=75:b"  # 200 ms (stock beep type 3)
  beep_food_low: "foodlow:d=8,o=6,b=60:b,p,b,p,b,p,b,p,b"  # 5 x 500 ms on / 500 ms off

external_components:
  - source: ${feeder_component_source}
    components: [feeder_motor]

feeder_motor:

esphome:
  on_boot:
    priority: -100
    then:
      - delay: 1s
      - pcf8563.read_time:
          id: rtc_time
      - light.turn_on:
          id: led
          effect: pairing_blink

wifi:
  reboot_timeout: 0s  # keep feeding offline instead of rebooting every 15 min

api:
  reboot_timeout: 0s

globals:
  - id: food_sensor_count
    type: int
  - id: last_food_sensor_count
    type: int
    initial_value: "0"
    restore_value: true
  - id: last_food_scoops_count
    type: int
    initial_value: "0"
    restore_value: true
  - id: last_feed_timestamp
    type: int
    restore_value: true
    initial_value: "0"
  - id: outlet_blocked_latched  # stock BLOCK_DOOR flag
    type: bool
    initial_value: "false"

script:
  - id: play_rtttl
    parameters:
      song_str: string
    then:
      - if:
          condition:
            lambda: return !(id(mute_sounds).state);
          then:
            - rtttl.play:
                rtttl: !lambda "return song_str;"
  - id: actuate_feeder
    parameters:
      scoops: int
    then:
      - lambda: |-
          if (scoops <= 0) return;
          // Stock start checks: refuse on DC fault or low battery.
          if (id(dc_fault).state) {
            ESP_LOGW("feeder", "Feed refused: DC_ERR");
            id(feeder_state).publish_state("Refused: power fault");
            return;
          }
          if (id(low_battery).state) {
            ESP_LOGW("feeder", "Feed refused: low battery");
            id(feeder_state).publish_state("Refused: low battery");
            return;
          }
          if (!feeder::motor().start((uint8_t) scoops, millis())) {
            ESP_LOGW("feeder", "Feed of %d scoops refused: motor busy", scoops);
            return;
          }
          ESP_LOGI("feeder", "Serving %d scoops (%d loops)", scoops, feeder::motor().target());
          id(play_rtttl)->execute("${beep_short}");
          id(food_sensor_count) = 0;
          id(last_feed_timestamp) = id(sntp_time).now().timestamp;
          id(feeder_state).publish_state("Feeding");
  # Button held about 1.5 s: stock "mid long" press, feeds while held.
  - id: button_hold
    mode: restart
    then:
      - delay: 1500ms
      - lambda: |-
          if (!id(manual_feed_button).state) return;
          if (id(child_lock).state) {
            ESP_LOGI("feeder", "Hold feed ignored: child lock");
            return;
          }
          if (id(dc_fault).state || id(low_battery).state) return;
          if (feeder::motor().start_hold(millis())) {
            ESP_LOGI("feeder", "Hold feed started");
            id(food_sensor_count) = 0;
            id(last_feed_timestamp) = id(sntp_time).now().timestamp;
            id(feeder_state).publish_state("Feeding (button)");
          }
  - id: dispatch_feeder_food_dispensed_event
    parameters:
      event_message: string
    then:
      - homeassistant.event:
          event: esphome.feeder_food_dispensed
          data:
            message: !lambda return event_message;
  - id: dispatch_feeder_food_low_event
    parameters:
      event_message: string
    then:
      - homeassistant.event:
          event: esphome.feeder_food_low
          data:
            message: !lambda return event_message;
  - id: dispatch_feeder_fault_event
    parameters:
      fault: string
      event_message: string
    then:
      - homeassistant.event:
          event: esphome.feeder_fault
          data:
            fault: !lambda return fault;
            message: !lambda return event_message;
  # Applies a feed result coming from the motor controller.
  - id: handle_feed_result
    parameters:
      result: int
    then:
      - lambda: |-
          auto &m = feeder::motor();
          id(last_food_sensor_count) = id(food_sensor_count);
          id(last_food_scoops_count) = m.valid_loops();
          id(feed_max_current).publish_state(m.max_current_mv());
          id(feed_unjam_attempts).publish_state(m.attempts());
          if (m.outlet_blocked()) {
            id(outlet_blocked_latched) = true;
            id(dispatch_feeder_fault_event)->execute("BLOCK_DOOR",
                "${friendly_name}: the outlet stayed covered, check the bowl.");
          }
          id(outlet_blocked).publish_state(id(outlet_blocked_latched));
          switch ((feeder::Result) result) {
            case feeder::Result::OK: {
              id(motor_fault).publish_state("None");
              id(feeder_state).publish_state("Food dispensed");
              int n = m.valid_loops();
              id(dispatch_feeder_food_dispensed_event)->execute(n == 1
                  ? std::string("${friendly_name} dispensed 1 scoop of food.")
                  : "${friendly_name} dispensed " + to_string(n) + " scoops of food.");
              break;
            }
            case feeder::Result::CANCELLED:
              id(feeder_state).publish_state("Feed cancelled");
              break;
            case feeder::Result::GRATE_ERROR:
              id(motor_fault).publish_state("GRAT_ERR");
              id(feeder_state).publish_state("Grate error");
              id(dispatch_feeder_fault_event)->execute("GRAT_ERR",
                  "${friendly_name}: the motor turned but no scoop was counted.");
              break;
            case feeder::Result::BLOCKED:
              id(motor_fault).publish_state("BLOCK_FOOD");
              id(feeder_state).publish_state("Food blocked");
              id(dispatch_feeder_fault_event)->execute("BLOCK_FOOD",
                  "${friendly_name}: food is jammed, check the dispenser.");
              break;
            default:
              break;
          }
          ESP_LOGI("feeder", "Feed done: result=%d, %d/%d loops, %d with food, max %.0f mV, %d un-jam attempts",
                   result, m.loops_done(), m.target(), m.valid_loops(), m.max_current_mv(), m.attempts());

interval:
  # LED like stock: on while Home Assistant is connected, slow blink otherwise.
  - interval: 1s
    then:
      - lambda: |-
          static int last = -1;
          int style = (api::global_api_server != nullptr && api::global_api_server->is_connected()) ? 1 : 3;
          if (style == last) return;
          last = style;
          auto call = id(led).turn_on();
          call.set_effect(style == 1 ? "None" : "offline_blink");
          call.perform();
  # Motor control loop (10 ms, like the stock app task).
  - interval: 10ms
    then:
      - lambda: |-
          static feeder::Drive last = feeder::Drive::SLEEP;
          auto &m = feeder::motor();
          float mv = 0.0f;
          if (m.needs_current()) {
            // Stock scaling: calibrated ADC mV x 16 / 11.
            mv = id(motor_current_adc).sample() * 1000.0f * 16.0f / 11.0f;
          }
          feeder::Drive d = m.tick(millis(), mv, id(motor_sensor).state, id(feed_sensor).state);
          if (d != last) {
            last = d;
            // GPIO19 / GPIO17 / GPIO18
            switch (d) {
              case feeder::Drive::FORWARD:
                id(motor_in_a).turn_off(); id(motor_in_b).turn_on(); id(motor_enable).turn_on();
                break;
              case feeder::Drive::REVERSE:
                id(motor_in_a).turn_on(); id(motor_in_b).turn_off(); id(motor_enable).turn_on();
                break;
              case feeder::Drive::BRAKE:
                id(motor_in_a).turn_on(); id(motor_in_b).turn_on(); id(motor_enable).turn_on();
                break;
              case feeder::Drive::SLEEP:
                id(motor_enable).turn_off(); id(motor_in_a).turn_off(); id(motor_in_b).turn_off();
                break;
            }
          }
          feeder::Result r = m.take_result();
          if (r != feeder::Result::NONE) {
            id(handle_feed_result)->execute((int) r);
          }
  # Stock food alarm: 5 beeps every 30 s while the hopper is low.
  - interval: 30s
    then:
      - lambda: |-
          if (!id(food_low).state || !id(food_low_alarm).state) return;
          if (id(on_battery).state) return;  // stock: no food alarm on battery
          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            int h = now.hour, from = (int) id(food_alarm_from).state, to = (int) id(food_alarm_to).state;
            bool inside = from <= to ? (h >= from && h < to) : (h >= from || h < to);
            if (!inside) return;
          }
          id(play_rtttl)->execute("${beep_food_low}");

