substitutions:
  device_name: esp32-relay-x4_modbus-v1-3

esphome:
  name: ${device_name}

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  baud_rate: 0

# ==========================
# RELAYS (OUTPUTS)
# ==========================
switch:
  - platform: gpio
    pin:
      number: 23
      inverted: true
    name: "Relay 1"

  - platform: gpio
    pin:
      number: 5
      inverted: true
      ignore_strapping_warning: true
    name: "Relay 2"

  - platform: gpio
    pin:
      number: 4
      inverted: true
    name: "Relay 3"

  - platform: gpio
    pin:
      number: 13
      inverted: true
    name: "Relay 4"

# ==========================
# INPUTS (BINARY SENSORS)
# ==========================
binary_sensor:
  - platform: gpio
    pin:
      number: 25
      inverted: true
    name: "Input 1"

  - platform: gpio
    pin:
      number: 26
      inverted: true
    name: "Input 2"

  - platform: gpio
    pin:
      number: 27
      inverted: true
    name: "Input 3"

  - platform: gpio
    pin:
      number: 33
      inverted: true
    name: "Input 4"

  # ==========================
  # EXTRA PADS (RX2/TX2)
  # ==========================
  - platform: gpio
    pin:
      number: 16
      inverted: true
      mode: INPUT_PULLUP
    name: "Pad RX2 as input"

  - platform: gpio
    pin:
      number: 17
      inverted: true
      mode: INPUT_PULLUP
    name: "Pad TX2 as input"

# ==========================
# RS485 (MODBUS) UART
# ==========================
uart:
  rx_pin: 18 # RS485 RX
  tx_pin: 19 # RS485 TX
  flow_control_pin: 32 # RS485 DE
  baud_rate: 9600

# ==========================
# Status LED (system state)
# ==========================
status_led:
  pin:
    number: 15
    inverted: true
    ignore_strapping_warning: true
