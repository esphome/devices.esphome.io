# ---------------------------------------------------------------------------
# plug-gestures.yaml - optional button gestures and child lock for the Shelly Plug M Gen3.
# Ported from the Plug S Gen3 core package. Use it together with config.yaml, plug-protection.yaml
# and plug-led.yaml.
#
#   1x click                       toggle the relay (config.yaml; blocked while the child lock is on)
#   2x click                       next LED effect (Current -> Power -> Temperature)
#   3x click                       child lock ON
#   3x click, hold the last press  child lock OFF (hold for 1.5 s)
#   hold 2.5 s                     acknowledge a fault (plug-protection.yaml), otherwise LED on/off
#
# The LED gives feedback: orange blink = pressed while locked, fast red blink = pressed while a
# fault is latched, orange fade-in = child lock on, green fade-out = child lock off.
# While the child lock is on, the LED flashes orange briefly every 3 s.
# ---------------------------------------------------------------------------

script:
  # Start a one-shot LED feedback animation (see fx_kind in plug-led.yaml)
  - id: show_fx
    mode: restart
    parameters:
      kind: int
    then:
      - lambda: |-
          id(fx_kind) = kind;
          id(fx_start) = millis();

  # Turn the LED on with the effect selected by effect_idx
  - id: apply_effect
    mode: restart
    then:
      - light.turn_on:
          id: rgb_lights
          effect: !lambda |-
            static const char *const names[] = {"Live Current", "Live Power", "Live Temperature"};
            return std::string(names[id(effect_idx) % 3]);

  # 2x click: switch to the next effect
  - id: next_effect
    mode: restart
    then:
      - lambda: |-
          id(effect_idx) = (id(effect_idx) + 1) % 3;
      - script.execute: apply_effect

switch:
  # Child lock. Persistent, so unplugging the plug does not release it.
  - platform: template
    id: button_lock
    name: "Button Lock"
    icon: "mdi:lock"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          id(button_locked) = true;
    on_turn_off:
      - lambda: |-
          id(button_locked) = false;

binary_sensor:
  - id: !extend push_button
    on_multi_click:
      # ---- 1x click: feedback only (the toggle itself is in config.yaml) ----
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.35s
        then:
          - if:
              condition:
                switch.is_on: button_lock
              then:
                - script.execute:
                    id: show_fx
                    kind: 1
              else:
                - if:
                    condition:
                      lambda: "return id(fault_active);"
                    then:
                      - script.execute:
                          id: show_fx
                          kind: 2

      # ---- 2x click: next effect -------------------------------------------
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at most 0.4s
          - OFF for at least 0.35s
        then:
          - if:
              condition:
                switch.is_on: button_lock
              then:
                - script.execute:
                    id: show_fx
                    kind: 1
              else:
                - script.execute: next_effect

      # ---- 3x click: child lock ON -----------------------------------------
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at most 0.4s
          - OFF for at least 0.35s
        then:
          - switch.turn_on: button_lock
          - script.execute:
              id: show_fx
              kind: 3
          - logger.log:
              level: INFO
              format: "Child lock engaged"

      # ---- 3x click, hold the last press: child lock OFF --------------------
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at least 1.5s
        then:
          - switch.turn_off: button_lock
          # ignore the 2.5 s "long press" that would otherwise follow while the button is still held
          - lambda: |-
              id(gesture_suppress_until) = millis() + 6000;
          - script.execute:
              id: show_fx
              kind: 4
          - logger.log:
              level: INFO
              format: "Child lock released"

      # ---- hold 2.5 s: LED on/off (acknowledging a fault is done by plug-protection.yaml) ----
      - timing:
          - ON for at least 2.5s
        then:
          - if:
              condition:
                lambda: "return (int32_t)(id(gesture_suppress_until) - millis()) > 0;"
              then:
                - logger.log:
                    level: DEBUG
                    format: "Long press ignored (part of the unlock gesture)"
              else:
                - if:
                    condition:
                      switch.is_on: button_lock
                    then:
                      - script.execute:
                          id: show_fx
                          kind: 1
                    else:
                      - if:
                          condition:
                            lambda: "return !id(fault_active);"
                          then:
                            - if:
                                condition:
                                  light.is_on: rgb_lights
                                then:
                                  - light.turn_off: rgb_lights
                                else:
                                  - script.execute: apply_effect
