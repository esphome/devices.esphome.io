# Additional config: zero-cross switching of the relay (optional).
# Replaces the plain `gpio` relay switch of config.yaml, so remove the `switch:` entry with `id: relay` there
# (or use this file instead of it). Custom component: https://github.com/oxynatOr/esphome-zero_cross_switch

external_components:
  - source:
      type: git
      url: https://github.com/oxynatOr/esphome-zero_cross_switch
      ref: dc893c08a23a8866b195ef215a6b60f59c5712e1
    components: [zero_cross_switch]

switch:
  - platform: zero_cross_switch
    id: relay
    name: "Relay"
    relay_pin: GPIO0
    chip_type: bl0942
    uart_id: uart_0  # bus of the BL0942; used to switch its pin from CF pulses to zero-cross output
    zx_pin:
      number: GPIO3
      mode: INPUT_PULLUP
    zx_edge: ANY  # level flips at every zero crossing (~6000 edges/min at 50 Hz)
    restore_mode: RESTORE_DEFAULT_OFF
    frequency:
      name: "Mains frequency (zero-cross)"
