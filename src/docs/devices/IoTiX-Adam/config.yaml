esphome:
  name: iotix-adam
  friendly_name: IoTiX Adam

esp32:
  board: esp32dev

logger:

wifi:
  ap:

i2c:
  id: bus_a
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 100kHz

pcf8574:
  - id: hub_out
    address: 0x26
    pcf8575: true
  - id: hub_in
    address: 0x27
    pcf8575: true

switch:
  - platform: gpio
    id: do_1
    name: DO1
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: hub_out
      number: 0
      mode: OUTPUT
      inverted: true
