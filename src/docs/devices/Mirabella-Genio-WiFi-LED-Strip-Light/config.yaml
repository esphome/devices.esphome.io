# Config for Mirabella Genio WiFi LED Strip Light
# https://devices.esphome.io/devices/Mirabella-Genio-WiFi-LED-Strip-Light/
esphome:
  name: mirabella-led-strip

esp8266:
  board: esp01_1m

wifi:
  ap: {}
logger:
output:
  - platform: esp8266_pwm
    id: output_red
    pin: GPIO4
  - platform: esp8266_pwm
    id: output_green
    pin: GPIO12
  - platform: esp8266_pwm
    id: output_blue
    pin: GPIO14
  - platform: esp8266_pwm
    id: output_white
    pin: GPIO5

light:
  - platform: rgbw
    name: "Strip Light"
    id: strip_light
    red: output_red
    green: output_green
    blue: output_blue
    white: output_white

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "strip_light_pushbutton"
    internal: true
    id: strip_light_pushbutton
