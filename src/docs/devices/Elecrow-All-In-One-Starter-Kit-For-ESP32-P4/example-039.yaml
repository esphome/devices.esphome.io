# Wi-Fi via ESP32-C6 using ESP-Hosted SPI full duplex (1-wire)
esp32_hosted:
  variant: ESP32C6
  active_high: true

  # SPI Full Duplex (Don't use half-duplex)
  type: spi
  reset_pin: GPIO2  # EN Wireless Module Reset
  cs_pin: GPIO14  # GPIO19 Wireless Module CS
  clk_pin: GPIO15  # GPIO18 Wireless Module CLK
  mosi_pin: GPIO7  # GPIO20 Wireless Module MOSI
  miso_pin: GPIO9  # GPIO21 Wireless Module MISO
  data_ready_pin: GPIO10 # GPIO22 Wireless Module Ready
  handshake_pin: GPIO11 # GPIO23 Wireless Module Handshake

