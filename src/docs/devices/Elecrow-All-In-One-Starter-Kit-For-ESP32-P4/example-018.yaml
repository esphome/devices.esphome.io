i2c:
  sda: GPIO18
  scl: GPIO19

sensor:
  # 8. IMU 6-DoF
  - platform: lsm6ds
    address: 0x6B
    accel_x:
      name: "Accel X"
    accel_y:
      name: "Accel Y"
    accel_z:
      name: "Accel Z"
    gyro_x:
      name: "Gyro X"
    gyro_y:
      name: "Gyro Y"
    gyro_z:
      name: "Gyro Z"
