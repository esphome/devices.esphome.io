esphome:
  name: thread-test
  friendly_name: thread-test

esp32:
  board: esp32-h2-devkitm-1
  variant: ESP32H2
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "YourEncryptionKeyGenerated by ESPHome"

ota:
  - platform: esphome
    # SECURITY: credential omitted from documentation example

network:
  enable_ipv6: true

openthread:
  tlv: yourTLVfromStep0

# Output and light configuration for a single red LED
output:
  - platform: gpio
    pin: GPIO1
    id: red_led

light:
  - platform: binary
    name: "Red LED"
    output: red_led
