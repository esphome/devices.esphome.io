i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: GPIO21
    i2s_bclk_pin: GPIO22

speaker:
  - platform: i2s_audio
    id: speaker_output
    i2s_audio_id: i2s_output
    dac_type: external
    i2s_dout_pin: GPIO23
    channel: stereo

switch:
  - platform: gpio
    pin: GPIO6
    name: "Speaker Enable"
    id: speaker_enable
    restore_mode: ALWAYS_ON
