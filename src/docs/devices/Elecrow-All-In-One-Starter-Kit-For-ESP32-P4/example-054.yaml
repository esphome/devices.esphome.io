sensor:

  - platform: usb_hidx
    type: gamepad
    axis: lx
    id: gp_axis_lx
    name: "Gamepad Left X"
    internal: true
    on_value:
      - lambda: lv_arc_set_value(id(gp_lx_arc), (int)x);

  - platform: usb_hidx
    type: gamepad
    axis: rx
    id: gp_axis_rx
    name: "Gamepad Right X"
    internal: true
    on_value:
      - lambda: lv_arc_set_value(id(gp_rx_arc), (int)x);

  # Lesson 1 Ultrasonic Sensor
  - platform: ultrasonic
    id: ultrasonic_sensor_001
    trigger_pin: GPIO13
    echo_pin: GPIO12
    name: "Distance"
    update_interval: 1s
    timeout: 3m
    filters:
      - filter_out: nan
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    on_value:
      then:
        - lvgl.label.update:
            id: distance_label
            text:
              format: "Distance: %.1f m"
              args: [x]

  # Lesson 12 Light Sensor
  - platform: bh1750
    id: light_sensor_001
    i2c_id: bsp2_bus
    address: 0x5C
    name: "Illuminance"
    update_interval: 5s
    on_value_range:
      - below: 10
        then:
          - lvgl.label.update:
              id: light_label
              text: !lambda 'return str_sprintf("DARK: %.0f lx", id(light_sensor_001).state);'
      - above: 500
        then:
          - lvgl.label.update:
              id: light_label
              text: !lambda 'return str_sprintf("BRIGHT: %.0f lx", id(light_sensor_001).state);'
    on_value:
      then:
        - lvgl.label.update:
            id: light_label
            text: !lambda 'return str_sprintf("LIGHT: %.0f lx", x);'

  # Lesson 11 Temperature and Humidity
  - platform: aht10
    variant: AHT20  # Explicitly setting the variant for better internal timing
    i2c_id: bsp2_bus
    address: 0x38
    update_interval: 10s
    temperature:
      name: "Temperature"
      id: sensor_temp
      on_value:
        then:
          - lvgl.label.update:
              id: temperature_label
              text:
                format: "%.1f°C"
                args: [x]
    humidity:
      name: "Humidity"
      id: sensor_hum
      on_value:
        then:
          - lvgl.label.update:
              id: humidity_label
              text:
                format: "Hum: %.1f%%"
                args: [x]

  - platform: lsm6ds
    accel_x:
      name: "Accel X"
      id: imu_ax
      on_value:
        then:
          - lvgl.label.update:
              id: accel_data
              text: !lambda |-
                return str_sprintf("X:%.1f Y:%.1f Z:%.1f",
                  id(imu_ax).state, id(imu_ay).state, id(imu_az).state);
    accel_y:
      name: "Accel Y"
      id: imu_ay
    accel_z:
      name: "Accel Z"
      id: imu_az
    gyro_x:
      name: "Gyro X"
      id: imu_gx
      on_value:
        then:
          - lvgl.label.update:
              id: gyro_data
              text: !lambda |-
                return str_sprintf("P:%.1f R:%.1f Y:%.1f",
                  id(imu_gx).state, id(imu_gy).state, id(imu_gz).state);
    gyro_y:
      name: "Gyro Y"
      id: imu_gy
    gyro_z:
      name: "Gyro Z"
      id: imu_gz
    temperature:
      name: "IMU Temperature"
      id: imu_temp
      on_value:
        then:
          - lvgl.label.update:
              id: imu_temp_label
              text:
                format: "IMU Temp: %.1f°C"
                args: [x]
