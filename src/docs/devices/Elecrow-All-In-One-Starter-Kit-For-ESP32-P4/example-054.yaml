substitutions:
  device_name: esp32-p4-elecrow-aio
  friendly_name: "ESP32-P4 Elecrow All-In-One"
  light_recessed: "\U000F179B"
  wall_sconce_round: "\U000F0748"
  gas_burner: "\U000F1A1B"
  home_icon: "\U000F02DC"
  menu_left: "\U000F0A02"
  menu_right: "\U000F035F"
  close: "\U000F0156"
  delete: "\U000F01B4"
  backspace: "\U000F006E"
  check: "\U000F012C"
  arrow_down: "\U000F004B"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - custom.h
    - lvgl_detect_image_format.h
  platformio_options:
    build_flags:
      - -DLIBSSH2_MBEDTLS
      - -DHAVE_CONFIG_H
      - -DESPHOME_STB_IMAGE_IMPL
  includes_c:
    - stb_image_impl.h

  on_boot:
    priority: -100
    then:
      - lambda: |-
          auto files = id(sd_card).list_directory("/", 0);
          ESP_LOGI("sdcard", "SD boot: %d files", files.size());
      - lambda: |-
          lvgl_keyboard_init(
            id(onscreen_kb)->obj,
            id(terminal_input),
            []() { id(osk_enter_pressed) = true; },
            []() { id(ssh_client)->handle_key(0x03); }
          );
          id(ssh_client)->set_lvgl_callback([](const std::string &text) {
            lvgl_textarea_set_text(id(terminal_output), text.c_str());
            lvgl_scroll_to_bottom(id(terminal_output));
          });
      - lvgl.label.update:
          id: sd_label
          text: !lambda |-
            auto files = id(sd_card).list_directory("/", 0);
            return str_sprintf("SD: %d files", (int)files.size());

esp32:
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf
    #log_level: VERBOSE
    #version: 6.13.0
    #platform_version: 55.3.37
    advanced:
      enable_idf_experimental_features: true
      disable_vfs_support_dir: false
      include_builtin_idf_components:
        - fatfs
        - wear_levelling
    sdkconfig_options:
      #CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      CONFIG_ESP_H264_DUAL_TASK: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_FATFS_LFN_STACK: "y"

      CONFIG_VFS_SUPPORT_IO: "y"
      CONFIG_VFS_MAX_COUNT: "16"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      #CONFIG_ESP_MAIN_TASK_STACK_SIZE: "65536"
      CONFIG_ESP_TIMER_TASK_STACK_SIZE: "4096"
      #CONFIG_ESP_TIMER_TASK_STACK_SIZE: "8192"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_ESP_TASK_LOOP_STACK_SIZE: "16384"
      CONFIG_FATFS_LFN_HEAP: "y"
      DCONFIG_USE_AUDIO_AAC_SUPPORT: "y"
      #DCONFIG_ESP_JPG_DECODE_ENABLE: "y"
      #DCONFIG_ESPHOME_ENABLE_PNGLE: "1"
      CONFIG_SPIRAM_SPEED_200M: "y"  # ← NOUVEAU: 200 MHz au lieu de défaut
      CONFIG_SPIRAM_SPEED: "200"
      CONFIG_LWIP_SOCKET: "y"
      #CONFIG_LWIP_SO_RCVBUF: "y"
      CONFIG_LWIP_MAX_SOCKETS: "16"
      #CONFIG_HTTPD_MAX_REQ_HDR_LEN: "800"
      #CONFIG_HTTPD_WS_SUPPORT: "y"
  engineering_sample: true

safe_mode:
  disabled: true

