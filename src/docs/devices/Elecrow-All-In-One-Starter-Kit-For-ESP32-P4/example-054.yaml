text_sensor:
  - platform: usb_hidx
    type: device
    id: usb_device_name
    name: "USB Device"
    internal: true
    on_value:
      - lambda: lvgl_label_set_text(id(gp_device_label), x.c_str());

  - platform: homeassistant
    id: ha_player_state
    entity_id: media_player.esp32_p4_elecrow_all_in_one
    on_value:
      then:
        - lambda: |-
            if (x == "idle" || x == "off") {
              lvgl_label_set_text(id(track_name), "Idle");
              lvgl_label_set_text(id(artist_name), "");
            }

  - platform: sendspin
    id: sendspin_title
    type: title
    on_value:
      - lambda: id(sendspin_album_art_valid) = false;
      - lvgl.label.update:
          id: track_name
          text: !lambda 'return x.empty() ? "Idle" : x.c_str();'

  - platform: sendspin
    id: sendspin_artist
    type: artist
    on_value:
      - lvgl.label.update:
          id: artist_name
          text: !lambda 'return x.c_str();'

  - platform: homeassistant
    id: ha_track_name
    entity_id: media_player.esp32_p4_elecrow_all_in_one
    attribute: media_title
    on_value:
      then:
        - lvgl.label.update:
            id: track_name
            text: !lambda 'return x.empty() ? "Idle" : x.c_str();'

  - platform: homeassistant
    id: ha_artist_name
    entity_id: media_player.esp32_p4_elecrow_all_in_one
    attribute: media_artist
    on_value:
      then:
        - lvgl.label.update:
            id: artist_name
            text: !lambda 'return x.c_str();'

  - platform: homeassistant
    id: ha_album_art_url
    entity_id: media_player.esp32_p4_elecrow_all_in_one
    attribute: entity_picture
    on_value:
      then:
        - lambda: |-
            if (!x.empty()) {
              std::string url = x;
              if (url.find("http") == std::string::npos) {
                url = "http://home-assistant.local:8123" + url;
              }
              auto img = id(album_art_img);
              img->set_url(url);
              img->update();
            }
  - platform: usb_hidx
    type: keyboard
    name: "Keyboard Input"
    id: keyboard_input_sensor
    internal: true
    on_value:
      - lambda: |-
          if (x.empty()) return;
          char c = x[0];
          auto textarea = id(terminal_input);
          if (c == '\n') {
            id(ssh_client)->handle_key('\n');
            lvgl_textarea_set_text(textarea, "");
          } else if (c == '\b') {
            const char* current_text = lvgl_textarea_get_text(textarea);
            if (current_text && strlen(current_text) > 0) {
              std::string s = current_text;
              s.pop_back();
              lvgl_textarea_set_text(textarea, s.c_str());
            }
            id(ssh_client)->handle_key('\b');
          } else if (c >= 32 && c <= 126) {
            char buf[2] = {c, 0};
            lvgl_textarea_add_text(textarea, buf);
            id(ssh_client)->handle_key(c);
          }

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: GPIO21
    i2s_bclk_pin: GPIO22
  - id: i2s_input
    i2s_lrclk_pin: GPIO3

speaker:
  - platform: i2s_audio
    id: speaker_output
    i2s_audio_id: i2s_output
    dac_type: external
    i2s_dout_pin: GPIO23
    channel: stereo
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 48000
  - platform: mixer
    id: mixing_speaker
    output_speaker: speaker_output
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
      - id: media_mixing_input
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

microphone:
  - platform: i2s_audio
    id: microphone_input
    i2s_audio_id: i2s_input
    i2s_din_pin: GPIO04
    adc_type: external
    pdm: true
    channel: left
    sample_rate: 16000

media_source:
  - platform: audio_http
    id: http_announcement_source
  - platform: audio_http
    id: http_media_source
  - platform: sendspin
    id: sendspin_media_source

rtttl:
  id: buzzer
  speaker: speaker_output

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    name: Sendspin Group Media Player

  - platform: speaker_source
    name: ${friendly_name} Speaker
    id: speaker_player
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
      sources:
        - http_announcement_source
    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source
