# SD card images moved to inline rgb565 above

interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (id(osk_enter_pressed)) {
            id(osk_enter_pressed) = false;
            auto textarea = id(terminal_input);
            const char* text = lvgl_textarea_get_text(textarea);
            if (text && strlen(text) > 0) {
              std::string cmd = text;
              std::string output = "$ " + cmd + "\n";
              if (id(ssh_client)->get_state() == esphome::microssh::SSH_CONNECTED) {
                id(ssh_client)->send_command(cmd);
                output += "[Command sent to SSH server]\n";
              } else if (cmd.find("ssh") == 0) {
                output += "Connecting to SSH...\n";
                id(ssh_client)->connect_ssh();
              } else {
                output += "Not connected. Type 'ssh' to connect.\n";
              }
              lvgl_textarea_add_text(id(terminal_output), output.c_str());
              lvgl_textarea_set_text(textarea, "");
            }
          }
          if (!id(rotation_locked)) {
            float ax = id(imu_ax).state;
            float ay = id(imu_ay).state;
            int new_rot = -1;
            if (ax > 4.0f)       new_rot = 90;
            else if (ax < -4.0f) new_rot = 270;
            else if (ay < -4.0f) new_rot = 180;
            else if (ay > 4.0f)  new_rot = 0;
            if (new_rot != -1) {
              if (new_rot == id(imu_rot_candidate)) {
                id(imu_rot_count) = id(imu_rot_count) + 1;
              } else {
                id(imu_rot_candidate) = new_rot;
                id(imu_rot_count) = 1;
              }
              if (id(imu_rot_count) >= 5 && new_rot != id(last_imu_rotation)) {
                id(last_imu_rotation) = new_rot;
                id(display_rotation) = new_rot;
                id(lvgl_component).set_rotation(
                  static_cast<esphome::display::DisplayRotation>(new_rot));
                lvgl_invalidate_screen();
              }
            } else {
              id(imu_rot_count) = 0;
            }
          }
          static std::string last_output = "";
          std::string current_output = id(ssh_client)->get_output();
          if (current_output != last_output) {
            lvgl_textarea_set_text(id(terminal_output), current_output.c_str());
            last_output = current_output;
            lvgl_scroll_to_bottom(id(terminal_output));
          }
          auto state = id(ssh_client)->get_state();
          if (state == esphome::microssh::SSH_CONNECTED) {
            lvgl_label_set_text(id(connection_status), "Connected");
            lvgl_set_text_color(id(connection_status), 0x00FF00, LV_PART_MAIN);
          } else {
            lvgl_label_set_text(id(connection_status), "Disconnected");
            lvgl_set_text_color(id(connection_status), 0xFF0000, LV_PART_MAIN);
          }
          // ===== VIRTUAL LED SYNC =====
          {
            auto &color = id(rgb_leds).current_values;
            uint8_t r = 0, g = 0, b = 0, w = 0;
            auto mode = static_cast<uint8_t>(color.get_color_mode());
            if (mode & 2) { // RGB mode
              r = (uint8_t)(color.get_color_brightness() * color.get_red()   * 255);
              g = (uint8_t)(color.get_color_brightness() * color.get_green() * 255);
              b = (uint8_t)(color.get_color_brightness() * color.get_blue()  * 255);
            }
            if (mode & 1) { // WHITE mode
              w = (uint8_t)(color.get_white() * 255);
            }
            lvgl_set_bg_color_rgb(id(led_red), r, 0, 0, LV_PART_MAIN);
            lvgl_set_bg_color_rgb(id(led_yellow), w, w, 0, LV_PART_MAIN);
            lvgl_set_bg_color_rgb(id(led_green), 0, g, 0, LV_PART_MAIN);
            lvgl_set_bg_color_rgb(id(led_blue), 0, 0, b, LV_PART_MAIN);
          }

