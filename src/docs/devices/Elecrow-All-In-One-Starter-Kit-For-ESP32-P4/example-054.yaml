time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Toronto" # Adjusted for your likely location
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: clock_label
              text: !lambda 'return id(sntp_time).now().strftime("%H:%M");'
          - lvgl.label.update:
              id: date_label
              text: !lambda 'return id(sntp_time).now().strftime("%Y-%m-%d");'

# LDO Regulators - both required (LDO3 for DSI PHY, LDO4 for 3.3V peripherals)
esp_ldo:
  - channel: 3
    voltage: 2.5V
  - channel: 4
    voltage: 2.5V

lsm6ds:
  id: imu
  i2c_id: bsp2_bus
  address: 0x6B
  accel_range: 2G
  gyro_range: 250DPS
  accel_odr: 26HZ
  gyro_odr: 26HZ
  update_interval: 100ms

i2c:
  # Camera
  - id: bsp_bus
    sda: GPIO45
    scl: GPIO46
    frequency: 400kHz
  # Light Sensor, Humidity/Temperature Sensor, Touch Screen
  - id: bsp2_bus
    sda: GPIO18
    scl: GPIO19
    frequency: 400kHz

touchscreen:
  - platform: gt911
    id: touch_panel
    i2c_id: bsp2_bus
    address: 0x5D  # GT911 backup address (IDF driver tries this first)
    reset_pin: GPIO40
    interrupt_pin:
      number: GPIO41
      # SPI ESP32_Hosted WiFi may conflict with this interrupt.
      mode: INPUT
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    calibration:
      x_min: 0
      x_max: 1024
      y_min: 0
      y_max: 600
    update_interval: 50ms # If you use #mode: INPUT for SPI ESP32_Hosted WiFi you need to set this.
    on_touch:
      - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );
display:
  - platform: mipi_dsi
    id: main_display
    model: CUSTOM
    reset_pin:
      number: GPIO05
      inverted: false
    rotation: 0
    #show_test_card: true
    auto_clear_enabled: false
    lanes: 2
    lane_bit_rate: 1000Mbps
    color_order: rgb
    #invert_colors: true

    pclk_frequency: 51MHz
    dimensions:
      width: 1024
      height: 600
    hsync_back_porch: 160
    hsync_pulse_width: 70
    hsync_front_porch: 160
    vsync_back_porch: 23
    vsync_pulse_width: 10
    vsync_front_porch: 12
    init_sequence:
      - [0xB2, 0x10] # PAD_CONTROL register: configures the DSI pad for 2-lane operation (0x10 = 2 lanes)
      - [0x80, 0x8B] # DSI timing/PLL register, sets lane speed or clock divider parameter
      - [0x81, 0x78] # DSI timing register, typically horizontal timing or PLL multiplier
      - [0x82, 0x84] # DSI timing register, typically vertical timing or PLL divider
      - [0x83, 0x88] # DSI timing register, front/back porch or sync width parameter
      - [0x84, 0xA8] # DSI timing register, another porch/sync parameter
      - [0x85, 0xE3] # DSI timing register, likely horizontal active or blanking period
      - [0x86, 0x88] # DSI timing register, last of the timing chain parameters
      # MIPI DCS Sleep Out command; wakes the panel for normal operation.
      - [0x11]

esp_video:
  i2c_id: bsp_bus
  xclk_pin: GPIO30
  xclk_freq: 24000000
  enable_jpeg: true
  enable_isp: true
  use_heap_allocator: false

esp_cam_sensor:
  id: sc2336_cam
  i2c_id: bsp_bus
  sensor_type: SC2336         #"sensor_type" au lieu de "sensor"
  resolution: "1280x720"          # , 1024x600 ,vga
  pixel_format: "RGB565"      # Zero-copy
  framerate: 30
  jpeg_quality: 15
  mirror_x: false    # Flip horizontal (hardware)
  mirror_y: false      # Flip vertical
  rotation: 0          # 0/90/180/270°
  crop_offset_x: 0     # Crop pixels from left

lvgl_camera_display:
  id: camera_display
  camera_id: sc2336_cam
  canvas_id: camera_canvas
  update_interval: 33ms
  #face_detection_id: face_detect
  #yolo11_detection_id: yolo_detect

output:
  - platform: ledc
    pin: GPIO20
    id: backlight_pwm
    frequency: 30000Hz  # IDF default is 30kHz (CONFIG_BLIGHT_PWM_Hz)
  - platform: gpio
    pin: GPIO06
    id: led_06_output
  - platform: gpio
    pin: GPIO27
    id: led_27_output
  - platform: ledc
    id: servo_pwm
    pin: GPIO25
    frequency: 50Hz

servo:
  - id: servo_id
    output: servo_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON

  # Lesson 4 WS2814A LED
  - platform: esp32_rmt_led_strip
    id: rgb_leds
    name: "RGB LEDs"
    chipset: WS2814
    pin:
      number: GPIO8
    num_leds: 1
    rgb_order: WRGB
    is_wrgb: true
    color_interlock: true
    # bit0_high: 400ns
    # bit0_low: 900ns
    # bit1_high: 600ns
    # bit1_low: 700ns
    # reset_low: 300us
    rmt_symbols: 192
    default_transition_length: 0s

# UPDN=0 (normal vertical), SHLR=1 (mirrored horizontal) per IDF gpio_set_level calls
switch:
  - platform: gpio
    pin: GPIO42
    name: "Relay"
    id: relay_switch_hw
  - platform: gpio
    pin: GPIO32
    name: "Display UPDN"
    id: display_updn
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF   # UPDN = 0

  - platform: gpio
    pin: GPIO33
    name: "Display SHLR"
    id: display_shlr
    internal: true
    restore_mode: RESTORE_DEFAULT_ON    # SHLR = 1
  - platform: template
    name: "LVGL Camera Display"
    id: lvgl_display_enable_switch
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - esp_cam_sensor.start_streaming:
          id: sc2336_cam
      - lambda: |-
          id(camera_display).set_enabled(true);
    turn_off_action:
      - lambda: |-
          id(camera_display).set_enabled(false);
      - esp_cam_sensor.stop_streaming:
          id: sc2336_cam

lvgl:
  id: lvgl_component
  use_ppa: true
  buffer_size: 0.25
  color_depth: 16
  byte_order: little_endian
  default_font: roboto20
  log_level: WARN

  msgboxes:
    - id: simple_box
      title: Simple
      body: ""
      close_button: true
    - id: message_box
      close_button: true
      title: Messagebox
      bg_color: 0xffff
      body:
        text: This is a sample messagebox
        bg_color: 0x808080
      #button_style:
      #  bg_color: 0x00FF00
      buttons:
        - id: msgbox_button
          text: Button
          on_click:
            lvgl.widget.show: simple_box
        - id: msgbox_apply
          text: "Close"
          on_click:
            then:
              - lvgl.widget.hide: message_box
  on_idle:
    - timeout: 10s
      then:
        - logger.log: idle timeout
        - if:
            condition:
              lvgl.is_idle:
                timeout: !lambda return 5000;
            then:
              - logger.log: LVGL is idle
    - timeout: 15s
      then:
        - logger.log: idle 15s timeout

      #- lvgl.pause:
      #- light.turn_off:
      #    id: display_backlight
      #    transition_length: 5s
  bottom_layer:
    bg_image_src: background_main
    bg_color: color_back
  #bg_opa: TRANSP

  gradients:
    - id: color_bar
      direction: hor
      #dither: none
      stops:
        -
          color: 0xFF0000
          position: 0
        -
          color: 0xFFFF00
          position: 42
        -
          color: 0x00FF00
          position: 84
        -
          color: 0x00FFFF
          position: 127
        -
          color: 0x0000FF
          position: 169
        -
          color: 0xFF00FF
          position: 212
        -
          color: 0xFF0000
          position: 255

# --- GLOBAL STYLES ---
  style_definitions:
    - id: main_bg_style
      bg_opa: 0%
      pad_all: 0
      border_width: 0

    - id: hud_text
      text_color: 0x00D4FF  # Neon Cyan
      text_font: roboto20

    - id: label_title
      text_font: roboto20
      text_color: 0x00D4FF

    - id: transparent_card
      bg_opa: 0%
      border_width: 0
      pad_all: 10

    - id: sensor_label
      text_color: 0x00D4FF
      text_font: roboto20
      align: LV_ALIGN_BOTTOM_RIGHT

    - id: transparent_matrix
      bg_opa: 0%
      border_width: 0
      pad_all: 0
      text_color: 0x00D4FF
      text_font: roboto20

    - id: matrix_btn_style
      bg_opa: 0%
      border_width: 1
      border_color: 0x00D4FF
      text_color: 0x00D4FF
      radius: 4

    - id: card_style # Used for nested boxes like Voice Assistant
      bg_color: 0x222222
      bg_opa: 30%
      radius: 10
      border_width: 1
      border_color: 0x444444

    - id: mag_style_off
      bg_color: 0x444444
      border_color: 0x444444
      border_width: 2
      radius: 20

    - id: header_footer
      bg_opa: 0%            # Transparent background
      border_width: 0
      text_color: 0x00D4FF  # Neon Cyan
      text_font: helv20
  theme:
    arc:
      scroll_on_focus: true
    slider:
      scroll_on_focus: true
    button:
      text_font: roboto10
      scroll_on_focus: true
      border_width: 2
      border_side: [left, top]
      outline_pad: 6
      text_color: 0x00D4FF
      checked:
        text_color: 0x00D4FF
      pressed:
        border_color: 0xFF0000
        text_color: 0x00D4FF
      focused:
        border_color: 0x00FF00
    checkbox:
      border_color: 0xC0C0C0
      indicator:
        text_font: montserrat_14
      checked:
        bg_color: 0xC0C0C0


  top_layer:
    text_font: helv20
    widgets:
      - buttonmatrix:
        width: 100%
        height: 10%
        y: 17
        align: bottom_mid
        id: top_layer
        styles: header_footer
        items:
          styles: header_footer
        rows:
          - buttons:
              - id: top_prev
                text: "${menu_left}"
                width: 1
                on_click:
                  lvgl.page.previous:
              - id: top_home
                text: "${home_icon}"
                width: 1
                on_click:
                  then:
                    lvgl.page.show: main_page
              - id: top_next
                text: "${menu_right}"
                width: 1
                on_click:
                  lvgl.page.next:

# --- PAGE CONFIGURATION ---
  pages:
    - id: main_page
      styles: main_bg_style
      width: 1024
      height: 600
      pad_all: 0
      text_color: 0x00D4FF
      widgets:
        # --- LAYER 0: BACKGROUND ---
        - image:
            id: bg_canvas
            src: background_main
            width: 1024
            height: 600

        # --- HEADER ---
        - obj:
            height: 60
            width: 100%
            bg_opa: 0%
            widgets:
              # MAGNETIC SENSOR ICON
              - label:
                  id: mag_icon
                  x: 32
                  y: 0
                  align: TOP_LEFT
                  text_font: roboto20
                  text: "\U000F0347"
                  text_color: 0x444444
              # MOTION SENSOR ICON
              - label:
                  id: motion_icon
                  x: 56
                  y: 0
                  align: TOP_LEFT
                  text_font: roboto20
                  text: "\U000F0583"
                  text_color: 0x444444
