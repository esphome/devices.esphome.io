                        text: "KBD"
                        align: CENTER
                        text_color: 0x000000
                        text_font: mono_font_16
              - label:
                  id: connection_status
                  text: "Disconnected"
                  text_color: 0xFF0000
                  text_font: mono_font_16
        - textarea:
            id: terminal_output
            width: 100%
            flex_grow: 1
            text_color: 0x00FF00
            bg_color: 0x000000
            bg_opa: COVER
            border_color: 0x00FF00
            border_width: 2
            text_font: mono_font_16
            one_line: false
            text: "$ Waiting for connection...\n"
            scrollbar_mode: "AUTO"
        - keyboard:
            id: onscreen_kb
            width: 100%
            height: 250
            hidden: true
            bg_color: 0x000000
            bg_opa: COVER
            border_color: 0x00FF00
            border_width: 1
            text_font: mono_font_16
            items:
              text_color: 0x00FF00
              bg_color: 0x1E1E1E
              bg_opa: COVER
              border_color: 0x00FF00
              border_width: 1
              radius: 4
        - obj:
            width: 100%
            height: 60
            bg_color: 0x1E1E1E
            bg_opa: COVER
            border_width: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_cross: CENTER
            pad_left: 10
            pad_right: 10
            pad_top: 0
            pad_bottom: 0
            widgets:
              - label:
                  text: "$"
                  text_color: 0x00FF00
                  text_font: mono_font_16
              - textarea:
                  id: terminal_input
                  flex_grow: 1
                  height: 40
                  text_color: 0x00FF00
                  bg_color: 0x000000
                  bg_opa: COVER
                  border_color: 0x00FF00
                  border_width: 1
                  text_font: mono_font_16
                  one_line: true
                  placeholder_text: "Enter command..."
              - button:
                  id: send_button
                  width: 80
                  height: 40
                  bg_color: 0x00FF00
                  scrollbar_mode: "OFF"
                  on_click:
                    - lambda: |-
                        auto textarea = id(terminal_input);
                        const char* text = lvgl_textarea_get_text(textarea);
                        if (text && strlen(text) > 0) {
                          std::string cmd = text;
                          std::string output = "$ " + cmd + "\n";
                          if (id(ssh_client)->get_state() == esphome::microssh::SSH_CONNECTED) {
                            id(ssh_client)->send_command(cmd);
                            output += "[Command sent to SSH server]\n";
                          } else if (cmd.find("ssh") == 0) {
                            output += "Connecting to SSH...\n";
                            id(ssh_client)->connect_ssh();
                          } else {
                            output += "Not connected. Type 'ssh' to connect.\n";
                          }
                          lvgl_textarea_add_text(id(terminal_output), output.c_str());
                          lvgl_textarea_set_text(textarea, "");
                        }
                  widgets:
                    - label:
                        text: "SEND"
                        align: CENTER
                        text_color: 0x000000
                        text_font: mono_font_16

