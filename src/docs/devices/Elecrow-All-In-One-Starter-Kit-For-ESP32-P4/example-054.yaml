        #                 text: !lambda return "Switch state:";
        #             - lvgl.label.update:
        #                 id: label_1_2
        #                 text: "it's off"

  - platform: adc
    pin: GPIO16
    id: button_adc_sensor
    update_interval: 50ms
    attenuation: 12db

    filters:
      - median:
          window_size: 5
          send_every: 1

    on_value:
      then:
        - lambda: |-
            int btn = -1;

            // 1. IDLE CHECK (HIGH VOLTAGE)
            // Since your log shows 3.286V when let go, anything above 3.15V is "OFF"
            if (x > 3.15) {
              btn = -1;
            }
            // 2. BUTTON LADDER (Based on your calibrated logs)
            else if (x < 1.48) btn = 6; // DOWN/LEFT (~1.44V)
            else if (x < 1.60) btn = 0; // UP/LEFT (~1.55V)
            else if (x < 1.75) btn = 3; // LEFT (~1.64V)
            else if (x < 1.95) btn = 8; // DOWN/RIGHT (~1.85V)
            else if (x < 2.10) btn = 2; // UP/RIGHT (~2.02V)
            else if (x < 2.40) btn = 5; // RIGHT (~2.19V)
            else if (x < 2.75) btn = 7; // DOWN (~2.57V)
            else if (x < 3.10) btn = 1; // UP (~2.93V)
            else               btn = -1; // Catch-all for noise

            if (btn != id(last_btn)) {
              id(last_btn) = btn;
              auto *obj = id(adc_btns_view).obj;

              // 3. UNSET ALL: Explicitly loop through all 9 buttons to clear highlight
              for (int i = 0; i <= 8; i++) {
                lv_btnmatrix_clear_btn_ctrl(obj, i, LV_BTNMATRIX_CTRL_CHECKED);
              }

              if (btn == -1) {
                id(rgb_leds).turn_off().perform();
                ESP_LOGI("button_adc", "CLEAN RELEASE DETECTED (%.3fV)", x);
              } else {
                // Highlight the specific button
                lv_btnmatrix_set_btn_ctrl(obj, btn, LV_BTNMATRIX_CTRL_CHECKED);

                // LED Mixing Logic
                float r=0, g=0, b=0, w=0;
                if (btn == 0 || btn == 1 || btn == 2) g = 1.0; // UP components
                if (btn == 6 || btn == 7 || btn == 8) w = 1.0; // DOWN components
                if (btn == 0 || btn == 3 || btn == 6) r = 1.0; // LEFT components
                if (btn == 2 || btn == 5 || btn == 8) b = 1.0; // RIGHT components

                id(rgb_leds).turn_on()
                  .set_red(r).set_green(g).set_blue(b).set_white(w)
                  .perform();

                ESP_LOGI("button_adc", "MATCH: btn=%d (%.3fV)", btn, x);
              }
              // Force redraw to ensure "Checked" state is visually removed
              lv_obj_invalidate(obj);
            }

  - platform: adc
    pin: GPIO17
    id: gas_sensor_adc
    name: "Gas Sensor Voltage"
    update_interval: 500ms
    attenuation: 12db
    on_value:
      then:
        # Update Gas Bar (Idle 0.18V, Max ~2.7V)
        - lvgl.bar.update:
            id: gas_bar
            value: !lambda |-
              float val = (x - 0.18) * 35.0;
              if (val < 0) return 0;
              if (val > 100) return 100;
              return (int)val;

        # UI Warning Label Logic
        - if:
            condition: {lambda: "return x > 1.5;"}
            then:
              - lvgl.label.update: {id: gas_status_label, text: "GAS DETECTED!"}
            else:
              - lvgl.label.update: {id: gas_status_label, text: "Air Quality: Clean"}

