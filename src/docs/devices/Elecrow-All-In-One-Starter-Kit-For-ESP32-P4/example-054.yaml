                  bg_color: 0xFF6600
                  on_click:
                    - lambda: |-
                        id(rotation_locked) = !id(rotation_locked);
                    - lvgl.label.update:
                        id: lock_rotation_label
                        text: !lambda 'return std::string(id(rotation_locked) ? "UNLK" : "LOCK");'
                  widgets:
