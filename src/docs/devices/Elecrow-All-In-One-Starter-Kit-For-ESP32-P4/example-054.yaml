    key: "REPLACE_ME"

# OTA Updates
ota:
  - platform: esphome

# Ethernet Configuration (RMII definition)
ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1
  use_address: "REPLACE_ME"
  on_connect:
    then:
      - lvgl.label.update:
          id: eth_status_icon
          text: "\U000F0200"
          text_color: 0x00FF00
  on_disconnect:
    then:
      - lvgl.label.update:
          id: eth_status_icon
          text: "\U000F1CD1"
          text_color: 0xFF0000

