              - button:
                  id: rotate_button
                  width: 60
                  height: 30
                  bg_color: 0x00FF00
                  on_click:
                    - lambda: |-
                        id(display_rotation) = (id(display_rotation) + 90) % 360;
                        auto rot = static_cast<esphome::display::DisplayRotation>(id(display_rotation));
                        id(lvgl_component).set_rotation(rot);
                  widgets:
                    - label:
                        text: "ROT"
                        align: CENTER
                        text_color: 0x000000
                        text_font: mono_font_16
              - button:
                  id: lock_rotation_button
                  width: 60
