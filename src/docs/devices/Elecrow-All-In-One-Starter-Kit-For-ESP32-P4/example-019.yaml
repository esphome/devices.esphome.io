motion:
  - platform: lsm6ds
    id: imu
    i2c_id: sensor_i2c
    address: 0x6B
    update_interval: 100ms
    accel_x:
      name: "Accel X"
    accel_y:
      name: "Accel Y"
    accel_z:
      name: "Accel Z"
    gyro_x:
      name: "Gyro X"
    gyro_y:
      name: "Gyro Y"
    gyro_z:
      name: "Gyro Z"

sensor:
  - platform: lsm6ds
    lsm6ds_id: imu
    name: "IMU Temperature"
