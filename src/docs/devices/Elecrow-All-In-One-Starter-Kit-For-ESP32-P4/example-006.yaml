light:
  - platform: esp32_rmt_led_strip
    id: rgb_leds
    name: "RGBW LED"
    chipset: WS2814
    pin:
      number: GPIO8
    num_leds: 1
    rgb_order: WRGB
    is_wrgb: true
    color_interlock: true
    rmt_symbols: 192
    default_transition_length: 0s

interval:
  - interval: 1s
    then:
      - light.turn_on:
          id: rgb_leds
          white: 0%
          red: 100%
          green: 0%
          blue: 0%
      - delay: 1s
      - light.turn_on:
          id: rgb_leds
          white: 100%
          red: 0%
          green: 0%
          blue: 0%
      - delay: 1s
      - light.turn_on:
          id: rgb_leds
          white: 0%
          red: 0%
          green: 100%
          blue: 0%
      - delay: 1s
      - light.turn_on:
          id: rgb_leds
          white: 0%
          red: 0%
          green: 0%
          blue: 100%
