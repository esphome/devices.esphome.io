  mosi_pin: GPIO11
  miso_pin: GPIO10

sx126x:
  dio1_pin: GPIO53
  cs_pin: GPIO14
  busy_pin: GPIO15
  rst_pin: GPIO54
  pa_power: 3
  bandwidth: 125_0kHz
