sensor:
  - platform: adc
    pin: GPIO16
    name: "Button ADC"
    id: button_adc
    update_interval: 50ms
    attenuation: 12db
    filters:
      - median:
          window_size: 5
          send_every: 1
    on_value_range:
      - below: 0.5
        above: 0.3
        then:
          - logger.log: "Button Left pressed"
          - light.turn_on:
              id: rgb_leds
              red: 100%
              green: 0%
              blue: 0%
      - below: 1.0
        above: 0.8
        then:
          - logger.log: "Button Right pressed"
          - light.turn_on:
              id: rgb_leds
              red: 0%
              green: 0%
              blue: 100%
      - below: 1.7
        above: 1.5
        then:
          - logger.log: "Button Down pressed"
          - light.turn_on:
              id: rgb_leds
              red: 100%
              green: 100%
              blue: 0%
      - below: 2.5
        above: 2.3
        then:
          - logger.log: "Button Up pressed"
          - light.turn_on:
              id: rgb_leds
              red: 0%
              green: 100%
              blue: 0%
      - above: 3.0
        then:
          - logger.log: "Button released"
          - light.turn_off: rgb_leds

light:
  - platform: esp32_rmt_led_strip
    chipset: WS2814
    pin:
      number: GPIO8
    num_leds: 1
    name: "RGBW LED"
    id: rgb_leds
    rgb_order: WRGB
    is_wrgb: true
    color_interlock: true
    rmt_symbols: 192
    default_transition_length: 0s
