# Hardware-only copy. Full configuration (Wi-Fi, API, OTA, web server):
# https://github.com/makethingshappy/MTH-for-ESPHome/blob/a9598457c831f702040e549e6b084459b9cce84a/Configs/IoTsmart_ESP32-S3/iotextra-ssr-small-v3-02-iotsmart-esp32s3-v2-01-gpio.yaml
# IoTextra SSR Small 3.02 + IoTsmart ESP32-S3 2.01 — GPIO mode (HOST AP0..AP7)
# Source: IoTsmart/ESP32-S3/v.2.01/host-map.yaml + IoTextra-Digital/SSR Small/v.3.02/host-map.yaml
# Outputs RL1..RL8: SSR, active-low on the HOST line (output on = 0)
esphome:
  name: ssr-small-iotsmart-s3
  project:
    name: makethingshappy.iotextra-ssr-small-v3-02-iotsmart-esp32s3-v2-01-gpio
    version: "1.01"

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

# Waveshare ESP32-S3-Tiny on IoTsmart ESP32-S3: 4MB flash, 2MB PSRAM
psram:
  mode: quad

logger:
wifi:
  ap: {}

# HOST I2C: IoTsmart ESP32-S3 2.01 SDA=GPIO16, SCL=GPIO15 (onboard EEPROM 0x54-0x57 on the same bus)
i2c:
  id: host_i2c
  sda: GPIO16
  scl: GPIO15
  scan: true

switch:
  - {platform: gpio, id: rl1, name: "RL1", pin: {number: GPIO8, inverted: true}, restore_mode: ALWAYS_OFF}   # AP0, DO1
  - {platform: gpio, id: rl2, name: "RL2", pin: {number: GPIO9, inverted: true}, restore_mode: ALWAYS_OFF}   # AP1, DO2
  - {platform: gpio, id: rl3, name: "RL3", pin: {number: GPIO10, inverted: true}, restore_mode: ALWAYS_OFF}   # AP2, DO3
  - {platform: gpio, id: rl4, name: "RL4", pin: {number: GPIO11, inverted: true}, restore_mode: ALWAYS_OFF}   # AP3, DO4
  - {platform: gpio, id: rl5, name: "RL5", pin: {number: GPIO4, inverted: true}, restore_mode: ALWAYS_OFF}   # AP4, DO5
  - {platform: gpio, id: rl6, name: "RL6", pin: {number: GPIO5, inverted: true}, restore_mode: ALWAYS_OFF}   # AP5, DO6
  - {platform: gpio, id: rl7, name: "RL7", pin: {number: GPIO6, inverted: true}, restore_mode: ALWAYS_OFF}   # AP6, DO7
  - {platform: gpio, id: rl8, name: "RL8", pin: {number: GPIO7, inverted: true}, restore_mode: ALWAYS_OFF}   # AP7, DO8
