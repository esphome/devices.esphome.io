# --- Media player ---
media_player:
  - platform: speaker
    id: audio_player
    name: "Audio Player"
    announcement_pipeline:
      speaker: spkr
    on_announcement:
      - micro_wake_word.stop:
      - delay: 500ms
      - wait_until:
          not:
            media_player.is_announcing:
      - delay: 500ms
      - lambda: id(va).set_use_wake_word(false);
      - micro_wake_word.start:

# --- Fallback script: restarts wake word after silent commands ---
# When a voice command produces no TTS response, on_tts_stream_end never
# fires, so the wake word engine stays stopped. This script is called from
# on_end as a safety net: it waits 5 s (giving on_tts_stream_end time to
# act first), then restarts wake word only if it is not already running.
script:
  - id: restart_mww_fallback
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            not:
              micro_wake_word.is_running:
          then:
            - wait_until:
                not:
                  speaker.is_playing:
            - delay: 500ms
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:

# --- Wake word + voice assistant ---
micro_wake_word:
  id: mww
  microphone: mic
  vad:
    model: github://esphome/micro-wake-word-models/models/v2/vad.json
  models:
    - okay_nabu
  on_wake_word_detected:
    # Cancel a fallback still pending from the previous request, or it could
    # restart wake word mid-request and preempt the shared I2S bus.
    - script.stop: restart_mww_fallback
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  speaker: spkr
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 2
  volume_multiplier: 2.0

  on_client_connected:
    - delay: 2s
    - lambda: id(va).set_use_wake_word(false);
    - micro_wake_word.start:

  on_tts_stream_end:
    - wait_until:
        not:
          speaker.is_playing:
    - delay: 500ms
    - lambda: id(va).set_use_wake_word(false);
    - micro_wake_word.start:

  on_end:
    - light.turn_off: rgb_ring
    - script.execute: restart_mww_fallback

  on_error:
    - wait_until:
        not:
          speaker.is_playing:
    - lambda: id(va).set_use_wake_word(false);
    - micro_wake_word.start:
