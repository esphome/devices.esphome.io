esphome:
  name: waveshare-audio
  friendly_name: Waveshare Audio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

wifi:
  ap:

# --- I2C bus (shared by ES8311, ES7210, TCA9555, PCF85063) ---
i2c:
  scl: GPIO10
  sda: GPIO11

# --- RTC ---
time:
  - platform: pcf85063
    id: pcf85063_time

# --- I2S audio bus ---
i2s_audio:
  - id: i2s_audio_bus
    i2s_mclk_pin: GPIO12
    i2s_bclk_pin: GPIO13
    i2s_lrclk_pin: GPIO14

# --- Audio ADC (ES7210 quad-channel mic input) ---
audio_adc:
  - platform: es7210
    id: es7210_adc

# --- Microphone ---
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO15
    adc_type: external

# --- Audio DAC (ES8311 speaker output) ---
audio_dac:
  - platform: es8311
    id: es8311_dac

# --- Speaker ---
speaker:
  - platform: i2s_audio
    id: spkr
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO16
    dac_type: external
    audio_dac: es8311_dac

# --- TCA9555 I/O expander ---
tca9555:
  - id: exio
    address: 0x20

# --- Speaker amplifier enable (TCA9555 pin 8) ---
switch:
  - platform: gpio
    id: pa_enable
    name: "Speaker Amplifier"
    pin:
      tca9555: exio
      number: 8
      mode: OUTPUT
    restore_mode: ALWAYS_ON

# --- Buttons via TCA9555 ---
binary_sensor:
  - platform: gpio
    name: "Key1"
    pin:
      tca9555: exio
      number: 9
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "Key2"
    pin:
      tca9555: exio
      number: 10
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "Key3"
    pin:
      tca9555: exio
      number: 11
      mode: INPUT
      inverted: true

# --- WS2812B LED ring ---
light:
  - platform: esp32_rmt_led_strip
    id: rgb_ring
    name: "RGB Ring"
    pin: GPIO38
    num_leds: 7
    chipset: ws2812
    rgb_order: GRB
