# Voice assistant layer for the ReSpeaker Lite. Add this to the hardware
# configuration above. Requires ESPHome 2026.7.3 or newer — see the note about
# microWakeWord on older releases.

# voice_assistant talks to Home Assistant over the native API, so the component
# has to be present here.
api:

number:
  - platform: template
    id: hp_volume
    name: Headphone Volume
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 70
    optimistic: true
    on_value:
      then:
        - media_player.volume_set:
            id: respeaker_player
            volume: !lambda "return x / 100.0f;"

micro_wake_word:
  id: mww
  microphone:
    microphone: respeaker_mic
    channels: 0
    gain_factor: 4
  stop_after_detection: true
  models:
    - model: github://esphome/micro-wake-word-models/models/v2/hey_jarvis.json
      probability_cutoff: 0.90
      sliding_window_size: 3
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  microphone:
    microphone: respeaker_mic
    channels: 0
    gain_factor: 4
  media_player: respeaker_player
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0

  on_client_connected:
    - micro_wake_word.start:

  on_tts_start:
    # Restart rather than stop. The microphone is the I2S clock master, so
    # stopping it here would also stop the clocks the speaker depends on and
    # the spoken reply would be silent.
    - micro_wake_word.start:

  on_end:
    - wait_until:
        condition:
          media_player.is_idle:
            id: respeaker_player
        timeout: 30s
    - micro_wake_word.start:

  on_error:
    - micro_wake_word.start:
