esphome:
  name: clocteck
  friendly_name: ClocTeck Clock
  on_boot:
    priority: -100
    then:
      - light.turn_on: {id: tubes, effect: "None", brightness: 100%}


esp8266:
  board: esp8285
  restore_from_flash: false

logger:
  baud_rate: 0
  level: WARN

# Diagnostics. reset_reason names why the last boot ended (WDT vs power-on vs
# software reset), and free/loop_time show what the device has left.
debug:
  update_interval: 60s

wifi:
  ap:

# ===========================================================================
# MEASURED HARDWARE MAP (do not change without re-measuring)
#
#   LED block  0- 9  seconds ones   (RIGHTMOST)   inside-tube: slot = 9 - digit
#   LED block 10-19  seconds tens                 inside-tube: slot = 9 - digit
#   LED block 20-29  minutes ones                 inside-tube: slot = 9 - digit
#   LED block 30-39  minutes tens                 inside-tube: slot = 9 - digit
#   LED block 40-49  HOURS TENS                   inside-tube: slot = digit
#   LED block 50-59  HOURS ONES  (LEFTMOST)       inside-tube: slot = digit
#
# Other hard-won facts:
#  - addressable_set's range_to is INCLUSIVE (ESPHome adds +1 internally)
#  - All colour lambdas MUST return 0-1; 0-255 triggers the "should return
#    values in range 0-1" warning and mis-scales the output.
#  - Color(r,g,b) takes 0-255 uint8, so Color(1.0f, ...) is essentially black.
#    Use ESPHSVColor::to_rgb() when a real colour is needed.
#  - gamma_correct defaults to 2.8 and applies to the light's own brightness,
#    NOT to color_brightness. The light is pinned at brightness 100% and
#    color_brightness carries all dimming (linear, full range).
#  - esp8266_uart/esp8266_dma only work on GPIO2; our data pin is GPIO13, so
#    bit_bang is mandatory.
# ===========================================================================
globals:
  - id: bright_pct
    type: float
    restore_value: true
    initial_value: '100'
  - id: col_r
    type: float
    restore_value: true
    initial_value: '255'
  - id: col_g
    type: float
    restore_value: true
    initial_value: '180'
  - id: col_b
    type: float
    restore_value: true
    initial_value: '80'
  # 0 Clock | 1 Rainbow sweep | 2 Fire | 3 Breathe | 4 Sunset
  # 5 Colour (sliders) | 6 Alarm red (Home Assistant only)
  # Restored, to match the Effect select's restore_value. Without this, a reboot
  # left the dropdown showing the saved effect while the strip rendered mode 0.
  - id: mode_idx
    type: int
    restore_value: true
    initial_value: '0'
  - id: cur_h
    type: int
    restore_value: false
    initial_value: '0'
  - id: cur_m
    type: int
    restore_value: false
    initial_value: '0'
  # ---- frame buffers: computed once per frame, read by the slot blocks ----
  # These replace 18 copies of the per-tube/per-channel mode logic.
  - id: idx_of
    type: int[6]
    restore_value: false
    initial_value: '{0,0,0,0,0,0}'
  - id: r_of
    type: float[6]
    restore_value: false
    initial_value: '{0,0,0,0,0,0}'
  - id: g_of
    type: float[6]
    restore_value: false
    initial_value: '{0,0,0,0,0,0}'
  - id: b_of
    type: float[6]
    restore_value: false
    initial_value: '{0,0,0,0,0,0}'
  - id: cur_s
    type: int
    restore_value: false
    initial_value: '0'
  - id: time_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  # Display on/off. MUST live here rather than using light.turn_off: the
  # addressable output scales every write by current_values.get_state(), so
  # turning the light off multiplies all later addressable_set calls by zero
  # and the strip goes permanently black (an ON press could not recover it).
  - id: display_on
    type: bool
    restore_value: false
    initial_value: 'true'
  # Diagnostics: counts seconds the renderer never drew. At 1 Hz there is no
  # redundancy - one late frame means that second is never shown, which is the
  # visible "44 -> 46" skip. prev_s = -1 marks "no frame drawn yet".
  - id: prev_s
    type: int
    restore_value: false
    initial_value: '-1'
  - id: skips
    type: int
    restore_value: false
    initial_value: '0'

time:
  - platform: sntp
    id: ntp
    timezone: Europe/Berlin
    # Re-sync every 30 min. The default is 15 min, but each resync briefly
    # blanks has_time, and a WDT reboot was resetting the clock anyway.
    update_interval: 30min
    servers: [pool.ntp.org, time.cloudflare.com]
    on_time_sync:
      - logger.log: "NTP synced"
light:
  - platform: neopixelbus
    id: tubes
    name: "Display lights"
    type: GRB
    variant: WS2812
    pin: GPIO13
    num_leds: 60
    method: {type: bit_bang}
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    internal: true

# ---------------------------------------------------------------------------
# RENDERER RATE  (see the notes in index.md; measured, not guessed)
#
# NeoPixelBus' bit_bang method wraps every strip send in noInterrupts()/
# interrupts(). One 60-LED WS2812 frame is 1440 bits x 1.65 us ~= 2.4 ms with
# EVERY interrupt disabled. At 10 Hz that is ~24 ms/s of blocked interrupts,
# which starves the WiFi driver until the hardware watchdog reboots the chip
#     [E][esp8266:171]: *** CRASH DETECTED ON PREVIOUS BOOT ***
#     Reason: Hardware WDT - Level1Int (exccause=4)  PC: wDev_ProcessFiq
# The effects are driven by SECONDS (ts), not by the frame counter, so raising
# the rate does not make them smoother - it only spends interrupt budget.
# 1 Hz costs ~2.4 ms/s and is what the effects are tuned for.
# ---------------------------------------------------------------------------
interval:
  - interval: 1s
    then:
      # Read the time FIRST, in the same interval that draws it. These used to be
      # two independent 1 s intervals, which drift apart: the renderer would paint
      # the PREVIOUS second and then skip one, so the display read 44 -> 46.
      # One interval = the value and the pixels always agree.
      - lambda: |-
          auto t = id(ntp).now();
          id(time_ok) = t.is_valid();
          if (t.is_valid()) {
            id(cur_h) = t.hour;
            id(cur_m) = t.minute;
            id(cur_s) = t.second;
            // A normal frame advances the displayed second by exactly 1. More
            // than that means a whole second went unpainted.
            if (id(prev_s) >= 0) {
              int d = id(cur_s) - id(prev_s);
              if (d < 0) d += 60;
              if (d > 1) id(skips) += d - 1;
            }
            id(prev_s) = id(cur_s);
          } else {
            // Time went away (boot, or an NTP resync). Drop the baseline, or the
            // jump from 0 to the real second counts as a false skip.
            id(prev_s) = -1;
          }

      # blank the strip first
      - light.addressable_set:
          id: tubes
          range_from: 0
          range_to: 59
          red: 0%
          green: 0%
          blue: 0%
          color_brightness: !lambda 'return id(display_on) ? id(bright_pct) / 100.0f : 0.0f;'

      # compute the whole frame ONCE (replaces 18 copies of the mode logic)
      - lambda: |-
          // ------------------------------------------------------------------
          // Frame compute. Runs ONCE per second, so every animation is driven
          // by SECONDS (ts), never milliseconds - a sub-second sin() would
          // alias into jitter at this rate.
          //
          // Colours come from WLED palettes (wled00/palettes.cpp) so the look
          // matches what people know from WLED. A palette is read at position
          // p = 0..255 and interpolated between stops, exactly like WLED does.
          // ------------------------------------------------------------------
          {
            const int m  = id(mode_idx);
            const int ts = id(cur_h) * 3600 + id(cur_m) * 60 + id(cur_s);

            // WLED palettes, values lifted from WLED (wled00/palettes.cpp, MIT).
            // WLED reads a palette at 0..255 and interpolates between stops; the
            // helper below does the same. Only the colour VALUES are borrowed -
            // WLED's motion assumes 20-60 fps and would alias on a 1 Hz renderer.
            static const uint8_t PAL_RAINBOW[16][3] = {
              {0xFF,0x00,0x00},{0xEB,0x70,0x00},{0xD5,0x9B,0x00},{0xD5,0xBA,0x00},
              {0xD5,0xD5,0x00},{0x9C,0xEB,0x00},{0x00,0xFF,0x00},{0x00,0xEB,0x70},
              {0x00,0xD5,0x9B},{0x00,0x9C,0xD4},{0x00,0x00,0xFF},{0x70,0x00,0xEB},
              {0x9B,0x00,0xD5},{0xBA,0x00,0xBB},{0xD5,0x00,0x9B},{0xEB,0x00,0x72}
            };
            static const uint8_t PAL_SUNSET[7][3] = {
              {0xB5,0x00,0x00},{0xDA,0x55,0x00},{0xFF,0xAA,0x00},{0xD3,0x55,0x4D},
              {0xA7,0x00,0xA9},{0x49,0x00,0xBC},{0x00,0x00,0xCF}
            };

            // palette lookup: p 0..255 -> interpolated RGB
            auto pal = [](const uint8_t (*P)[3], int n, int p, float &r, float &g, float &b) {
              if (p < 0) p = 0;
              if (p > 255) p = 255;
              const float f  = (float) p / 255.0f * (float) (n - 1);
              const int   i  = (int) f;
              const int   i2 = (i + 1 < n) ? i + 1 : i;
              const float t  = f - (float) i;
              r = (P[i][0] + (P[i2][0] - P[i][0]) * t) / 255.0f;
              g = (P[i][1] + (P[i2][1] - P[i][1]) * t) / 255.0f;
              b = (P[i][2] + (P[i2][2] - P[i][2]) * t) / 255.0f;
            };

            const int dig[6] = {
              id(cur_s) % 10, id(cur_s) / 10,
              id(cur_m) % 10, id(cur_m) / 10,
              id(cur_h) / 10, id(cur_h) % 10
            };
            const int blk[6]     = {0, 10, 20, 30, 40, 50};
            const bool invert[6] = {true, true, true, true, false, false};

            for (int i = 0; i < 6; i++) {
              id(idx_of)[i] = blk[i] + (invert[i] ? (9 - dig[i]) : dig[i]);
              float r = 1.0f, g = 0.25f, b = 0.0f;

              switch (m) {
                case 0:  // Clock - nixie orange, teal seconds
                  if (i < 2) {r = 0.0f; g = 0.62f; b = 1.0f;}
                  else       {r = 1.0f; g = 0.25f; b = 0.0f;}
                  break;

                case 1:  // Rainbow sweep - the whole band TRAVELS to the LEFT.
                  // Slot i lives in block 10*i, and the strip is mirrored, so a
                  // higher slot is further left. Giving slot i the palette phase
                  // (base - i*S) means the colour that was at slot i is at slot
                  // i+1 one step later: the band walks leftwards, permanently,
                  // instead of every tube being tinted the same colour.
                  {
                    const int base = (ts * 256) / 24;   // full loop in 24 s
                    pal(PAL_RAINBOW, 16, ((base - i * 42) % 256 + 256) % 256, r, g, b);
                  }
                  break;

                case 2:  // Fire - a per-tube random crackle over a slow swell.
                  // At 1 Hz a SMOOTH per-tube gradient reads as noise, because
                  // one sample per second cannot convey motion - you just see
                  // six tubes at six arbitrary levels. Fire is genuinely a
                  // random process, so sampling noise once a second reads as
                  // fire. Each tube gets its own hash of (ts, i): no state, no
                  // drift, and the pattern only repeats after ~136 years.
                  {
                    uint32_t h = (uint32_t) ts * 2654435761u + (uint32_t) i * 40503u;
                    h ^= h >> 13; h *= 1274126177u; h ^= h >> 16;
                    const float rnd  = (float) (h & 0xFFFFu) / 65535.0f;
                    const float slow = 0.5f + 0.5f * sinf((float) ts * 0.4189f + (float) i * 1.1f);
                    const float k    = 0.18f + 0.82f * (0.55f * rnd + 0.45f * slow);
                    r = id(col_r) / 255.0f * k;
                    g = id(col_g) / 255.0f * k;
                    b = id(col_b) / 255.0f * k;
                  }
                  break;

                case 3:  // Breathe - a slow 10 s pulse on the SLIDER colour.
                  // Raised-cosine, not sin(), so each step is a real visible
                  // change (a 5 s sin() gives only ~0.2 per frame, which reads
                  // as barely moving). The colour is yours; only the level moves.
                  {
                    const float k = 0.25f + 0.75f
                        * (0.5f - 0.5f * cosf(2.0f * 3.14159265f * (float) (ts % 10) / 10.0f));
                    r = id(col_r) / 255.0f * k;
                    g = id(col_g) / 255.0f * k;
                    b = id(col_b) / 255.0f * k;
                  }
                  break;

                case 4:  // Sunset - WLED Sunset_Real, per-tube offset
                  pal(PAL_SUNSET, 7, (ts * 10 + i * 20) % 256, r, g, b);
                  break;

                case 5:  // Colour (sliders) - user colour, steady
                  r = id(col_r) / 255.0f;
                  g = id(col_g) / 255.0f;
                  b = id(col_b) / 255.0f;
                  break;

                case 6:  // Alarm red
                  r = 1.0f; g = 0.0f; b = 0.0f;
                  break;
              }
              id(r_of)[i] = r; id(g_of)[i] = g; id(b_of)[i] = b;
            }
          }
      # ---- seconds ones (slot 0) ----
      - light.addressable_set:
          id: tubes
          range_from: !lambda 'return id(idx_of)[0];'
          range_to: !lambda 'return id(idx_of)[0];'
          color_brightness: !lambda 'return id(display_on) ? id(bright_pct) / 100.0f : 0.0f;'
          red: !lambda 'return id(r_of)[0];'
          green: !lambda 'return id(g_of)[0];'
          blue: !lambda 'return id(b_of)[0];'

      # ---- seconds tens (slot 1) ----
      - light.addressable_set:
          id: tubes
          range_from: !lambda 'return id(idx_of)[1];'
          range_to: !lambda 'return id(idx_of)[1];'
          color_brightness: !lambda 'return id(display_on) ? id(bright_pct) / 100.0f : 0.0f;'
          red: !lambda 'return id(r_of)[1];'
          green: !lambda 'return id(g_of)[1];'
          blue: !lambda 'return id(b_of)[1];'

      # ---- minutes ones (slot 2) ----
      - light.addressable_set:
          id: tubes
          range_from: !lambda 'return id(idx_of)[2];'
          range_to: !lambda 'return id(idx_of)[2];'
          color_brightness: !lambda 'return id(display_on) ? id(bright_pct) / 100.0f : 0.0f;'
          red: !lambda 'return id(r_of)[2];'
          green: !lambda 'return id(g_of)[2];'
          blue: !lambda 'return id(b_of)[2];'

      # ---- minutes tens (slot 3) ----
      - light.addressable_set:
          id: tubes
          range_from: !lambda 'return id(idx_of)[3];'
          range_to: !lambda 'return id(idx_of)[3];'
          color_brightness: !lambda 'return id(display_on) ? id(bright_pct) / 100.0f : 0.0f;'
          red: !lambda 'return id(r_of)[3];'
          green: !lambda 'return id(g_of)[3];'
          blue: !lambda 'return id(b_of)[3];'

      # ---- hours tens (slot 4) ----
      - light.addressable_set:
          id: tubes
          range_from: !lambda 'return id(idx_of)[4];'
          range_to: !lambda 'return id(idx_of)[4];'
          color_brightness: !lambda 'return id(display_on) ? id(bright_pct) / 100.0f : 0.0f;'
          red: !lambda 'return id(r_of)[4];'
          green: !lambda 'return id(g_of)[4];'
          blue: !lambda 'return id(b_of)[4];'

      # ---- hours ones (slot 5) ----
      - light.addressable_set:
          id: tubes
          range_from: !lambda 'return id(idx_of)[5];'
          range_to: !lambda 'return id(idx_of)[5];'
          color_brightness: !lambda 'return id(display_on) ? id(bright_pct) / 100.0f : 0.0f;'
          red: !lambda 'return id(r_of)[5];'
          green: !lambda 'return id(g_of)[5];'
          blue: !lambda 'return id(b_of)[5];'
# ---------------------------------------------------------------------------
output:
  - platform: gpio
    id: buzzer_out
    pin: {number: GPIO15, mode: {output: true}}

switch:
  - platform: output
    name: "Buzzer"
    id: buzzer
    output: buzzer_out
    restore_mode: ALWAYS_OFF
binary_sensor:
  # Mode = GPIO0 (also the download strap - hold at power-on to re-flash)
  - platform: gpio
    id: btn_mode
    name: "Mode"
    pin: {number: GPIO0, mode: {input: true, pullup: true}, inverted: true}
    on_press:
      # Cycles the 6 normal effects. "6 Alarm red" is deliberately reachable
      # only from Home Assistant, never from the case buttons.
      - lambda: 'id(mode_idx) = (id(mode_idx) + 1) % 6;'

  - platform: gpio
    id: btn_time
    name: "Time"
    pin: {number: GPIO2, mode: {input: true, pullup: true}, inverted: true}
    on_press:
      - lambda: 'id(mode_idx) = 0;'

  # Up = GPIO16, active LOW (no pull-up / no interrupts on ESP8266 for GPIO16)
  - platform: gpio
    id: btn_up
    name: "Up"
    pin: {number: GPIO16, mode: {input: true, pulldown: true}, inverted: true}
    on_press:
      - lambda: 'id(bright_pct) = fminf(100.0f, id(bright_pct) + 10.0f);'

button:
  - platform: restart
    name: Restart
sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 120s
  # Uptime resets to 0 on every reboot, and Home Assistant keeps the history,
  # so any spontaneous restart is timestamped without needing a watcher script.
  - platform: uptime
    name: Uptime
    update_interval: 30s
  - platform: debug
    free:
      name: Free Heap
  - platform: debug
    loop_time:
      name: Loop Time
text_sensor:
  - platform: debug
    reset_reason:
      name: Reset Reason
