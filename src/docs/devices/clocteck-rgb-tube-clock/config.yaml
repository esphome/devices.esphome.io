# ---------------------------------------------------------------------------
output:
  - platform: gpio
    id: buzzer_out
    pin: { number: GPIO15, mode: { output: true } }

switch:
  - platform: output
    name: "Buzzer"
    id: buzzer
    output: buzzer_out
    restore_mode: ALWAYS_OFF
binary_sensor:
  # Mode = GPIO0 (also the download strap - hold at power-on to re-flash)
  - platform: gpio
    id: btn_mode
    name: "Mode"
    pin: { number: GPIO0, mode: { input: true, pullup: true }, inverted: true }
    on_press:
      - lambda: 'id(mode_idx) = (id(mode_idx) + 1) % 8;'

  - platform: gpio
    id: btn_time
    name: "Time"
    pin: { number: GPIO2, mode: { input: true, pullup: true }, inverted: true }
    on_press:
      - lambda: 'id(mode_idx) = 0;'

  # Up = GPIO16, active LOW (no pull-up / no interrupts on ESP8266 for GPIO16)
  - platform: gpio
    id: btn_up
    name: "Up"
    pin: { number: GPIO16, mode: { input: true, pulldown: true }, inverted: true }
    on_press:
      - lambda: |-
          float b = id(bright_pct) + 10.0f;
          if (b > 100.0f) b = 100.0f;
          id(bright_pct) = b;

button:
  - platform: restart
    name: Restart
sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 120s
