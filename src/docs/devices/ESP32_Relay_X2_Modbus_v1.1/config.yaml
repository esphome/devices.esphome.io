substitutions:
  device_name: esp32-relay-x2_modbus-v1-1

esphome:
  name: ${device_name}

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  baud_rate: 0

sensor:
  - platform: uptime
    name: Uptime

button:
  - platform: restart
    name: Reboot
  - platform: safe_mode
    name: Reboot in safe mode

# ==========================
# RELAYS (OUTPUTS)
# ==========================
switch:
  - platform: gpio
    pin:
      number: 33
      inverted: true
    name: "Relay 1"

  - platform: gpio
    pin:
      number: 25
      inverted: true
    name: "Relay 2"

# ==========================
# INPUTS (BINARY SENSORS)
# ==========================
binary_sensor:
  - platform: gpio
    pin:
      number: 27  # TBC
      inverted: true
    name: "Input 1"

  - platform: gpio
    pin:
      number: 26  # TBC
      inverted: true
    name: "Input 2"

  # ==========================
  # EXTRA PADS (RX2/TX2)
  # ==========================
  - platform: gpio
    pin:
      number: 16
      inverted: true
      mode: INPUT_PULLUP
    name: "Pad RX2 as input"

  - platform: gpio
    pin:
      number: 17
      inverted: true
      mode: INPUT_PULLUP
    name: "Pad TX2 as input"

  - platform: gpio
    pin:
      number: 5
      inverted: true
      mode: INPUT_PULLUP
      ignore_strapping_warning: true
    name: "Pad G5 as input"

  - platform: gpio
    pin:
      number: 23
      inverted: true
      mode: INPUT_PULLUP
    name: "Pad G23 as input"

  - platform: gpio
    pin:
      number: 21
      inverted: true
      mode: INPUT_PULLUP
    name: "Pad G21 as input"

  - platform: gpio
    pin:
      number: 22
      inverted: true
      mode: INPUT_PULLUP
    name: "Pad G22 as input"

# ==========================
# RS485 (MODBUS) UART
# ==========================
uart:
  rx_pin: 18  # RS485 RX
  tx_pin: 19  # RS485 TX
  flow_control_pin: 32  # RS485 DE (TBC)
  baud_rate: 9600
