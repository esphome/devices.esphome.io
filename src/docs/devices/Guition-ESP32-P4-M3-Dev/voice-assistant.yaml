# Guition ESP32-P4-M3-Dev - Home Assistant voice assistant satellite
#
# Wake word (microWakeWord) + Assist pipeline, audio out via the onboard
# speaker header, networking over the onboard 100M Ethernet (IP101 PHY).
# BLE/Wi-Fi come from the onboard ESP32-C6 via esp32_hosted.
#
# Add your own api:, ota: and wifi:/ethernet: credentials after adopting.
# Set ha_media_player below to the media_player entity Home Assistant
# creates for THIS device, or the announce/TTS relay will not fire.

substitutions:
  name: guition-p4-voice
  friendly_name: "Guition P4 Voice"
  alarm_entity: alarm_control_panel.alarmo
  tts_entity: tts.piper
  # MUST match your HA entity id for this ESPHome media_player
  ha_media_player: media_player.guition_p4_voice_guition_p4_voice
  exit_delay_seconds: "30"
  entry_delay_seconds: "30"
  triggered_repeat_seconds: "10"
  default_volume: "0.70"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "JC-ESP32P4-M3-DEV: Alarmo VA + Ethernet"
  on_boot:
    priority: 600
    then:
      - media_player.volume_set:
          id: board_player
          volume: ${default_volume}
      - delay: 1s
      - micro_wake_word.start

esp32:
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

# Required dependency for HTTP-mode C6 firmware update
http_request:

# =========================
# C6 Coprocessor Firmware Update
# =========================
update:
  - platform: esp32_hosted
    name: "C6 Coprocessor Firmware"
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h

# ============================================================
# ESP32-P4 has no native BLE — onboard ESP32-C6 via SDIO
# ============================================================
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 100ms
    active: true

bluetooth_proxy:
  active: true
  connection_slots: 4

# ============================================================
# Ethernet
# ============================================================
ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  clk:
    pin: GPIO50
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO51

psram:
  mode: hex
  speed: 100MHz

i2c:
  sda: GPIO7
  scl: GPIO8
  scan: true
  frequency: 400kHz

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

# Mic goes THROUGH the ES8311 (analog) - this board has NO ES7210.
# Ref: p1ngb4ck/unofficial_guition_esp32p4_repo JC-ESP32P4-M3-Dev example.
audio_dac:
  - platform: es8311
    id: codec
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 48000
    use_mclk: true
    use_microphone: true

microphone:
  - platform: i2s_audio
    id: board_mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO11
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

# --- Speakers (mixer so HA media + announcements both work) ---
speaker:
  - platform: i2s_audio
    id: spk_hw
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: codec
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    buffer_duration: 300ms
    timeout: 100ms
  - platform: mixer
    id: spk_mixer
    output_speaker: spk_hw
    task_stack_in_psram: true
    source_speakers:
      - id: spk_announcement
        buffer_duration: 300ms
        timeout: 100ms
      - id: spk_media
        buffer_duration: 300ms
        timeout: 100ms

media_player:
  - platform: speaker
    id: board_player
    name: "${friendly_name}"
    announcement_pipeline:
      speaker: spk_announcement
      format: FLAC
      num_channels: 2
      sample_rate: 48000
    media_pipeline:
      speaker: spk_media
      format: FLAC
      num_channels: 2
      sample_rate: 48000

number:
  - platform: template
    id: hp_volume
    name: "Headphone Volume"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 70
    optimistic: true
    on_value:
      then:
        - media_player.volume_set:
            id: board_player
            volume: !lambda "return x / 100.0f;"

micro_wake_word:
  microphone: board_mic
  stop_after_detection: true
  models:
    - model: github://esphome/micro-wake-word-models/models/v2/hey_jarvis.json
      internal: true
      probability_cutoff: 0.85
      sliding_window_size: 4
  on_wake_word_detected:
    - logger.log:
        format: "Wake word detected: %s"
        args: ["wake_word.c_str()"]
    - if:
        condition:
          not:
            voice_assistant.is_running: {}
        then:
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

voice_assistant:
  microphone: board_mic
  media_player: board_player
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_start:
    - logger.log: "VA: start"
    - script.stop: say_tts
  on_listening:
    - logger.log: "VA: listening"
    - micro_wake_word.stop
    - script.stop: say_tts
  on_stt_end:
    # Release I2S bus as soon as STT finishes — mic no longer needed.
    - logger.log:
        format: "VA: STT end: %s"
        args: ["x.c_str()"]
    - micro_wake_word.stop
    - microphone.stop_capture:
        id: board_mic
    - delay: 300ms
  on_intent_end:
    - logger.log: "VA: intent end"
  on_tts_start:
    - logger.log:
        format: "VA: TTS start: %s"
        args: ["x.c_str()"]
    - lambda: |-
        id(va_playback_pending) = true;
    - micro_wake_word.stop
    - microphone.stop_capture:
        id: board_mic
  on_tts_end:
    - logger.log: "VA: TTS end"
  on_end:
    - logger.log: "VA: end"
    - if:
        condition:
          lambda: return id(va_playback_pending);
        then:
          # TTS was generated — media_player is playing the response.
          # DON'T restart wake word now (it would grab the I2S bus
          # and block the speaker). Let resume_wake_after_playback
          # wait for the announcement to finish, then restart.
          - script.execute: resume_wake_after_playback
        else:
          # No TTS response — safe to restart wake word immediately.
          - delay: 300ms
          - micro_wake_word.start
  on_error:
    - logger.log:
        level: WARN
        format: "VA error: %s - %s"
        args: ["code.c_str()", "message.c_str()"]
    - lambda: |-
        id(va_playback_pending) = false;
    - micro_wake_word.start

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 60s
  - platform: internal_temperature
    name: "CPU Temperature"
    update_interval: 60s

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
      id: eth_ip_address
      entity_category: diagnostic
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
  - platform: homeassistant
    id: alarmo_state
    entity_id: ${alarm_entity}
    on_value:
      then:
        - logger.log:
            format: "Alarmo state update: %s"
            args: ['x.c_str()']
        - lambda: |-
            if (!id(alarmo_ready)) {
              id(alarmo_ready) = true;
              id(alarmo_last_state) = x;
              id(alarmo_should_announce) = false;
              return;
            }
            if (x == id(alarmo_last_state)) {
              id(alarmo_should_announce) = false;
              return;
            }
            id(alarmo_last_state) = x;
            id(alarmo_should_announce) = true;
        - if:
            condition:
              lambda: return id(alarmo_should_announce);
            then:
              - if:
                  condition:
                    or:
                      - voice_assistant.is_running: {}
                      - lambda: return id(va_playback_pending);
                  then:
                    - logger.log: "Alarmo announcement suppressed (voice assistant active)"
                  else:
                    - if:
                        condition:
                          lambda: return x != "triggered";
                        then:
                          - script.stop: triggered_repeat
                    - if:
                        condition:
                          lambda: return x == "disarmed";
                        then:
                          - script.stop: exit_countdown
                          - script.stop: entry_countdown
                          - script.execute:
                              id: say_tts
                              msg: "Alarm disarmed."
                    - if:
                        condition:
                          lambda: return x == "arming";
                        then:
                          - script.stop: entry_countdown
                          - script.execute:
                              id: say_tts
                              msg: "Arming. Exit delay started."
                          - script.execute: exit_countdown
                    - if:
                        condition:
                          lambda: return x.rfind("armed_", 0) == 0;
                        then:
                          - script.stop: exit_countdown
                          - script.execute:
                              id: say_tts
                              msg: !lambda |-
                                std::string pretty = x;
                                for (auto &c : pretty) if (c == '_') c = ' ';
                                return std::string("Alarm ") + pretty + ".";
                    - if:
                        condition:
                          lambda: return x == "pending";
                        then:
                          - script.stop: exit_countdown
                          - script.execute:
                              id: say_tts
                              msg: "Entry delay. Disarm now."
                          - script.execute: entry_countdown
                    - if:
                        condition:
                          lambda: return x == "triggered";
                        then:
                          - script.stop: exit_countdown
                          - script.stop: entry_countdown
                          - script.execute:
                              id: say_tts
                              msg: "Alarm activated."
                          - script.execute: triggered_repeat

button:
  - platform: template
    name: "Alarmo Debug Speak State"
    on_press:
      then:
        - script.execute:
            id: say_tts
            msg: !lambda |-
              return std::string("Alarm state is ") + id(alarmo_state).state + ".";
  - platform: template
    name: "VA Test: Start Listening"
    on_press:
      then:
        - logger.log: "Manual VA start"
        - voice_assistant.start
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config
  - platform: factory_reset
    name: "Factory Reset"
    entity_category: config
    disabled_by_default: true

script:
  - id: resume_wake_after_playback
    mode: restart
    then:
      - wait_until:
          condition:
            or:
              - media_player.is_announcing:
                  id: board_player
              - media_player.is_playing:
                  id: board_player
          timeout: 8s
      - wait_until:
          condition:
            media_player.is_idle:
              id: board_player
          timeout: 30s
      - lambda: |-
          id(va_playback_pending) = false;
      - delay: 800ms
      - micro_wake_word.start

  - id: audio_handoff_to_speaker
    mode: restart
    then:
      - micro_wake_word.stop
      - voice_assistant.stop
      - microphone.stop_capture:
          id: board_mic
      - wait_until:
          condition:
            not:
              micro_wake_word.is_running: {}
          timeout: 2s
      - delay: 500ms

  - id: say_tts
    mode: restart
    parameters:
      msg: string
    then:
      - script.execute: audio_handoff_to_speaker
      - script.wait: audio_handoff_to_speaker
      - media_player.volume_set:
          id: board_player
          volume: !lambda "return id(hp_volume).state / 100.0f;"
      - media_player.stop:
          id: board_player
      - homeassistant.service:
          service: media_player.stop
          data:
            entity_id: ${ha_media_player}
      - delay: 200ms
      - homeassistant.service:
          service: tts.speak
          data:
            entity_id: ${tts_entity}
            media_player_entity_id: ${ha_media_player}
            message: !lambda "return msg;"
            cache: "true"
      - script.execute: resume_wake_after_playback

  - id: exit_countdown
    mode: restart
    then:
      - lambda: id(exit_remaining) = atoi("${exit_delay_seconds}");
      - while:
          condition:
            lambda: return id(alarmo_state).state == "arming" && id(exit_remaining) > 0;
          then:
            - if:
                condition:
                  lambda: |-
                    int s = id(exit_remaining);
                    return (s==30 || s==20 || s==10 || s==5 || s==3 || s==2 || s==1);
                then:
                  - script.execute:
                      id: say_tts
                      msg: !lambda |-
                        char buf[64];
                        snprintf(buf, sizeof(buf), "Arming in %d seconds.", id(exit_remaining));
                        return std::string(buf);
            - delay: 1s
            - lambda: id(exit_remaining)--;

  - id: entry_countdown
    mode: restart
    then:
      - lambda: id(entry_remaining) = atoi("${entry_delay_seconds}");
      - while:
          condition:
            lambda: return id(alarmo_state).state == "pending" && id(entry_remaining) > 0;
          then:
            - if:
                condition:
                  lambda: |-
                    int s = id(entry_remaining);
                    return (s==30 || s==20 || s==10 || s==5 || s==3 || s==2 || s==1);
                then:
                  - script.execute:
                      id: say_tts
                      msg: !lambda |-
                        char buf[64];
                        snprintf(buf, sizeof(buf), "Disarm in %d seconds.", id(entry_remaining));
                        return std::string(buf);
            - delay: 1s
            - lambda: id(entry_remaining)--;

  - id: triggered_repeat
    mode: restart
    then:
      - while:
          condition:
            lambda: return id(alarmo_state).state == "triggered";
          then:
            - script.execute:
                id: say_tts
                msg: "Alarm activated."
            - delay: !lambda |-
                return (uint32_t) (atoi("${triggered_repeat_seconds}") * 1000);

globals:
  - id: exit_remaining
    type: int
    restore_value: no
    initial_value: "0"
  - id: entry_remaining
    type: int
    restore_value: no
    initial_value: "0"
  - id: alarmo_ready
    type: bool
    restore_value: no
    initial_value: "false"
  - id: alarmo_should_announce
    type: bool
    restore_value: no
    initial_value: "false"
  - id: alarmo_last_state
    type: std::string
    restore_value: no
    initial_value: '"__unset__"'
  - id: va_playback_pending
    type: bool
    restore_value: no
    initial_value: "false"
