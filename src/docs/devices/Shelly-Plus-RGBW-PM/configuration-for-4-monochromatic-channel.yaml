esphome:
  name: shelly-plus-rgbw-pm-monochrome

esp32:
  variant: esp32
  framework:
    type: esp-idf

light:
  - platform: monochromatic
    name: "White Channel R"
    output: out_r
    restore_mode: ALWAYS_ON
    default_transition_length: 0.5s
    id: channel_r

  - platform: monochromatic
    name: "White Channel G"
    output: out_g
    restore_mode: ALWAYS_ON
    default_transition_length: 0.5s
    id: channel_g

  - platform: monochromatic
    name: "White Channel B"
    output: out_b
    restore_mode: ALWAYS_ON
    default_transition_length: 0.5s
    id: channel_b

  - platform: monochromatic
    name: "White Channel W"
    output: out_w
    restore_mode: ALWAYS_ON
    default_transition_length: 0.5s
    id: channel_w

status_led:
  pin: GPIO14

output:
  - platform: ledc
    id: out_r
    pin: GPIO25

  - platform: ledc
    id: out_g
    pin: GPIO26

  - platform: ledc
    id: out_b
    pin: GPIO27

  - platform: ledc
    id: out_w
    pin: GPIO4

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO36
      inverted: true
    name: "Shelly Plus RGBW PM Input 1"
    filters:
      - delayed_on_off: 10ms

  - platform: gpio
    pin:
      number: GPIO37
      inverted: true
    name: "Shelly Plus RGBW PM Input 2"
    filters:
      - delayed_on_off: 10ms

  - platform: gpio
    pin:
      number: GPIO38
      inverted: true
    name: "Shelly Plus RGBW PM Input 3"
    filters:
      - delayed_on_off: 10ms

  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Shelly Plus RGBW PM Input 4"
    filters:
      - delayed_on_off: 10ms

  - platform: gpio
    pin:
      number: GPIO22
    name: "Shelly Plus RGBW PM Onboard Button"
    filters:
      - delayed_on_off: 10ms

sensor:
  - platform: adc
    pin: GPIO33
    id: temp_analog_reading
    attenuation: 12db

  - platform: resistance
    sensor: temp_analog_reading
    id: temp_resistance_reading
    configuration: DOWNSTREAM
    resistor: 10kOhm

  - platform: ntc
    sensor: temp_resistance_reading
    name: "Shelly Plus RGBW PM Temperature"
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K

  - platform: adc
    pin: GPIO34
    attenuation: 12db
    name: "Shelly Plus RGBW PM Voltage"
    accuracy_decimals: 1
    filters:
      - multiply: 10.85

  - platform: adc
    pin: GPIO35
    attenuation: 12db
    name: "Shelly Plus RGBW PM Current"
    accuracy_decimals: 2
    filters:
      - offset: -0.794
      - multiply: 16.13
    unit_of_measurement: "A"
