substitutions:
  name: esp32-trinity
  friendly_name: ESP32 Trinity

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev

logger:
  level: INFO

wifi:
  # Fallback hotspot only. Your own configuration adds your network; the ESPHome
  # Device Builder does that for you when you create the device there.
  ap:

# The onboard LED is on GPIO2, one of the few pins the matrix leaves free.
output:
  - platform: gpio
    id: onboard_led_output
    pin: GPIO2

light:
  - platform: binary
    id: onboard_led
    name: Onboard LED
    output: onboard_led_output

# The `board: esp32-trinity` preset supplies the whole HUB75 pinout, so no pins
# are listed here. Set panel_width/panel_height to match your panel.
display:
  - platform: hub75
    id: matrix
    board: esp32-trinity
    panel_width: 64
    panel_height: 64
    brightness: 80
    bit_depth: 5
    gamma_correct: CIE1931
    update_interval: 250ms
    # A test pattern that needs no network: red, green and blue bars inside a
    # white border. If you see all of it, the panel and the board are working.
    lambda: |-
      const int w = it.get_width();
      const int h = it.get_height();
      const int third = w / 3;
      it.filled_rectangle(0, 0, third, h, Color(255, 0, 0));
      it.filled_rectangle(third, 0, third, h, Color(0, 255, 0));
      it.filled_rectangle(2 * third, 0, w - 2 * third, h, Color(0, 0, 255));
      it.rectangle(0, 0, w, h, Color(255, 255, 255));
