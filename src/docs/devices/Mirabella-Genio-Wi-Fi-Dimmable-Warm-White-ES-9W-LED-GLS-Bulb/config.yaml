# Basic Config
# https://www.mirabella.com.au/products/i002604
esphome:
  name: genio22
  on_boot:
    priority: 100  # Highest priority, ensures light turns on without delay.
    then:
      - light.turn_on: genio22

esp8266:
  board: esp01_1m
wifi:
  ap: {}
logger:
sensor:
  - platform: wifi_signal
    name: "genio22 WiFi Signal"
    update_interval: 60s

switch:
  - platform: restart
    name: "genio22 Restart"

output:
  - platform: esp8266_pwm
    pin: 14
    frequency: 1000 Hz
    id: pwm_output

light:
  - platform: monochromatic
    name: "genio22 Light"
    output: pwm_output
    id: genio22
