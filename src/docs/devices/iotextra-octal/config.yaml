# Hardware-only copy. Full configuration (Wi-Fi, API, OTA, web server):
# https://github.com/makethingshappy/MTH-for-ESPHome/blob/a38f23c006aa3ed14a521c8e01b3ec0af9aadacd/Configs/IoTsmart_ESP32-S3/iotextra-octal-v3-04-iotsmart-esp32s3-v2-01-gpio.yaml
# IoTextra Octal 3.04 + IoTsmart ESP32-S3 2.01 — GPIO mode (HOST AP0..AP7)
# Source: IoTsmart/ESP32-S3/v.2.01/host-map.yaml + IoTextra-Digital/Octal/v.3.04/host-map.yaml
# All channels active-low on the HOST line: input active = 0, output on = 0
# Requires SB2 closed (HOST AP4 -> RL1). With SB1 closed AP4 is TCA9534 INT: RL1 will not work.
esphome:
  name: octal-iotsmart-s3
  project:
    name: makethingshappy.iotextra-octal-v3-04-iotsmart-esp32s3-v2-01-gpio
    version: "1.01"

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

# Waveshare ESP32-S3-Tiny on IoTsmart ESP32-S3: 4MB flash, 2MB PSRAM
psram:
  mode: quad

logger:
wifi:
  ap: {}

# HOST I2C: IoTsmart ESP32-S3 2.01 SDA=GPIO16, SCL=GPIO15 (onboard EEPROM 0x54-0x57 on the same bus)
i2c:
  id: host_i2c
  sda: GPIO16
  scl: GPIO15
  scan: true

binary_sensor:
  - {platform: gpio, id: in1, name: "IN1", pin: {number: GPIO8, inverted: true}}   # AP0
  - {platform: gpio, id: in2, name: "IN2", pin: {number: GPIO9, inverted: true}}   # AP1
  - {platform: gpio, id: in3, name: "IN3", pin: {number: GPIO10, inverted: true}}   # AP2
  - {platform: gpio, id: in4, name: "IN4", pin: {number: GPIO11, inverted: true}}   # AP3

switch:
  # AP4 via SB2, relay K1
  - {platform: gpio, id: rl1, name: "RL1", pin: {number: GPIO4, inverted: true}, restore_mode: ALWAYS_OFF}
  # AP5, relay K2
  - {platform: gpio, id: rl2, name: "RL2", pin: {number: GPIO5, inverted: true}, restore_mode: ALWAYS_OFF}
  - {platform: gpio, id: do1, name: "DO1", pin: {number: GPIO6, inverted: true}, restore_mode: ALWAYS_OFF}   # AP6
  - {platform: gpio, id: do2, name: "DO2", pin: {number: GPIO7, inverted: true}, restore_mode: ALWAYS_OFF}   # AP7
