substitutions:
  name: "waveshare-touch-epaper-154"
  friendly_name: "Waveshare Touch ePaper 1.54"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  flash_size: 8MB

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG   # this board's only USB is native USB-JTAG

# Add your own wifi: block with your credentials.

api:
ota:
  - platform: esphome

# Shared by the ES8311 codec (0x18), SHTC3 sensor (0x70), PCF85063 RTC (0x51)
# and, on the Touch variant only, the capacitive touch controller (0x38).
i2c:
  sda: GPIO47
  scl: GPIO48
  scan: true
  id: bus_a

# Single shared I2S bus. The ES8311 does both DAC (speaker) and ADC
# (microphone) -- there is no separate ADC chip on this board, unlike the
# RLCD-4.2 / S3-Audio-Board which pair ES8311 with an ES7210.
i2s_audio:
  - id: i2s_shared
    i2s_lrclk_pin: GPIO38
    i2s_bclk_pin: GPIO15
    i2s_mclk_pin: GPIO14

audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 16000
    # DO NOT set use_microphone: true on this board. It switches the ES8311's
    # ADC input from analog (this board's mic) to PDM digital (a mic this
    # board does not have), giving total silence with no error anywhere.
    # The analog mic path is already enabled by default.
    use_microphone: false
    mic_gain: 24dB   # 30dB+ clipped into garbled STT in testing; 24dB was accurate.

speaker:
  # The physical speaker on the shared I2S bus.
  - platform: i2s_audio
    id: i2s_audio_speaker
    i2s_audio_id: i2s_shared
    i2s_dout_pin: GPIO45
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit
  # The speaker media_player needs two DIFFERENT source speakers for its
  # announcement and media pipelines (ESPHome rejects both pointing at one
  # speaker), so mix two sources down onto the single physical speaker.
  - platform: mixer
    id: spk_mixer
    output_speaker: i2s_audio_speaker
    source_speakers:
      - id: media_in
      - id: announce_in
  - platform: resampler
    id: media_src
    output_speaker: media_in
  - platform: resampler
    id: announce_src
    output_speaker: announce_in

microphone:
  - platform: i2s_audio
    id: va_mic
    i2s_audio_id: i2s_shared
    i2s_din_pin: GPIO16
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit

# Audio power rail (GPIO42, active LOW) and the battery latch (GPIO17).
#
# These MUST be `power_supply:`, not `switch: platform: gpio`. ESPHome setup
# priorities (esphome/core/component.h):
#     POWER    = 1200  <- power_supply with enable_on_boot on an internal pin
#     BUS      = 1000  <- i2c
#     IO       =  900
#     HARDWARE =  800  <- switch: platform: gpio
# A gpio switch is therefore set up AFTER i2c, so restore_mode: ALWAYS_ON does
# NOT get the rail up before the bus scan. On a warm/OTA reboot you never notice,
# because the rails are still powered from the previous run. On a true cold boot
# the unpowered ES8311 holds SCL low and the whole bus dies:
#     "Recovery failed: SCL is held LOW during clock pulse cycle"
#     "Found no devices"          (plus an ~11s stall in i2c setup)
# power_supply with enable_on_boot: true reports setup_priority::POWER, the tier
# the core documents as "must be on before buses like i2c can work".
power_supply:
  - id: audio_power
    pin:
      number: GPIO42
      inverted: true          # PA_EN P-FET: driving LOW turns the rail ON
    enable_on_boot: true
    keep_on_time: 0s
  - id: vbat_power
    pin: GPIO17               # battery power latch; harmless on USB power
    enable_on_boot: true
    keep_on_time: 0s

# NS4150B speaker amplifier enable (PA_CTRL). Must be HIGH for any sound out.
# An ordinary gpio switch is fine here: the amp is not on any bus, so it does
# not need to be up before i2c, and this exposes it as a toggle in HA.
switch:
  - platform: gpio
    id: amp_enable
    name: "Speaker Amp"
    pin: GPIO46
    restore_mode: RESTORE_DEFAULT_ON

media_player:
  - platform: speaker
    id: spk_player
    name: None
    announcement_pipeline:
      speaker: announce_src
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    media_pipeline:
      speaker: media_src
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    # micro_wake_word OWNS the microphone. Hand the shared I2S bus over with
    # micro_wake_word.stop / .start ONLY. Do not add microphone.capture /
    # microphone.stop_capture actions anywhere in this config: an explicit
    # capture call creates a SECOND, independent claim on the mic that
    # micro_wake_word.stop cannot release, which pins the bus open and makes
    # every later playback attempt fail forever with "Parent bus is busy"
    # (not the harmless one-off retry -- an infinite retry loop). This is
    # easy to reproduce: a single announcement works, then the first full
    # voice pipeline run adds the extra claim and all subsequent playback
    # deadlocks.
    on_play:
      - micro_wake_word.stop:
    on_announcement:
      - micro_wake_word.stop:
    on_idle:
      - script.execute: restart_mww

micro_wake_word:
  id: mww
  microphone:
    microphone: va_mic
    channels: 0
    gain_factor: 4   # default of 1 leaves the model too quiet to ever hit its cutoff
  models:
    - model: hey_jarvis
  on_wake_word_detected:
    - voice_assistant.start:

voice_assistant:
  id: va
  microphone: va_mic
  media_player: spk_player
  use_wake_word: false   # micro_wake_word handles the wake word instead
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:
  on_error:
    - micro_wake_word.start:
  # micro_wake_word stops itself after a detection (stop_after_detection
  # defaults to true), so every run must end with it restarted -- including
  # runs that produce no TTS playback, where media_player on_idle never fires.
  # on_end fires at RUN_END, which can be BEFORE the TTS response has played;
  # with a media_player, voice_assistant stays "running" until that playback
  # finishes. So wait for the pipeline to go idle, then hand over to the same
  # script on_idle uses, which also waits for the speaker to release the bus.
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - script.execute: restart_mww

script:
  - id: restart_mww
    mode: restart   # on_idle and on_end can both call this; last one wins
    then:
      - wait_until:
          not:
            media_player.is_announcing:
      - wait_until:
          not:
            speaker.is_playing:
              id: i2s_audio_speaker
      - delay: 100ms
      - if:
          condition:
            not:
              micro_wake_word.is_running:
          then:
            - micro_wake_word.start:

sensor:
  - platform: shtcx
    address: 0x70
    i2c_id: bus_a
    update_interval: 60s
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"

binary_sensor:
  - platform: gpio
    name: "Boot Button"
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
