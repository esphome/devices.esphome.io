substitutions:
  devicename: shelly_plugm_gen3_01
  board: freenove_esp32_s3_wroom
  friendlyName: Washing Machine
  max_power: "3000"
  max_temp: "70.0"

esphome:
  name: ${devicename}
  friendly_name: ${friendlyName}

esp32:
  variant: esp32c3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y

sensor:
  - platform: ntc
    sensor: temp_resistance_reading
    name: "Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    id: s_temperature
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > ${max_temp};'
            then:
              - switch.turn_off: switch_relay
  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 10kOhm
  - platform: adc
    id: temp_analog_reading
    pin: GPIO1
    attenuation: 12db

  - platform: bl0942
    uart_id: uart_0
    voltage:
      name: "Voltage"
      id: bvoltage
      icon: mdi:alpha-v-circle-outline
      device_class: voltage
    current:
      name: "Current"
      id: bcurrent
      icon: mdi:alpha-a-circle-outline
      device_class: current
    power:
      name: "Power"
      id: bpower
      icon: mdi:transmission-tower
      device_class: power
      on_value_range:
        - above: ${max_power}
          then:
            - switch.turn_off: switch_relay
    energy:
      name: "Energy"
      id: benergy
      icon: mdi:lightning-bolt
      device_class: energy
    frequency:
      name: "Frequency"
      id: bfreq
      accuracy_decimals: 2
      icon: mdi:cosine-wave
      device_class: frequency
    update_interval: 5s

uart:
  id: uart_0
  tx_pin: GPIO4
  rx_pin:
    number: GPIO5
    mode:
      pullup: true
      input: true
  baud_rate: 9600
  stop_bits: 1

status_led:
  pin:
    number: GPIO19
    inverted: true

binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: GPIO7
      inverted: yes
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return (id(s_temperature).state < ${max_temp}) && (id(switch_relay).state == false);'
            then:
              - switch.turn_on: switch_relay
            else:
              - switch.turn_off: switch_relay
              - script.execute:
                  id: led_flash
                  frequency: 2.0   # 2 Hz
                  duty: 20.0       # 20 % on, 80 % off
                  count: 10        # 10 flashes

switch:
  - platform: gpio
    pin: GPIO0
    name: "Relais"
    id: switch_relay
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - output.turn_on: led_green
    on_turn_off:
      - output.turn_off: led_green

output:
  - platform: gpio
    pin: GPIO10
    inverted: true
    id: led_green

script:
  - id: led_flash
    mode: restart
    parameters:
      frequency: float   # Hz
      duty: float        # duty cycle in %, 0..100
      count: int         # number of flashes, 0 = endless
    then:
      - if:
          condition:
            lambda: 'return frequency > 0.0f;'
          then:
            - if:
                condition:
                  lambda: 'return count > 0;'
                then:
                  - repeat:
                      count: !lambda 'return count;'
                      then:
                        - output.turn_on: led_green
                        - delay: !lambda 'return (uint32_t)(1000.0f / frequency * duty / 100.0f);'
                        - output.turn_off: led_green
                        - delay: !lambda 'return (uint32_t)(1000.0f / frequency * (100.0f - duty) / 100.0f);'
                else:
                  - while:
                      condition:
                        lambda: 'return true;'
                      then:
                        - output.turn_on: led_green
                        - delay: !lambda 'return (uint32_t)(1000.0f / frequency * duty / 100.0f);'
                        - output.turn_off: led_green
                        - delay: !lambda 'return (uint32_t)(1000.0f / frequency * (100.0f - duty) / 100.0f);'
