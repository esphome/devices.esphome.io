# Enable logging
logger:
  level: DEBUG

wifi:
  ap:

esp8266:
  board: esp_wroom_02

substitutions:
  device_name: smart-oil-gauge-duo
  friendly_name: 'Smart Oil Gauge Duo'
  Samples_Before_Sleep: '6'  # Number of TOF measurements before calculating Volume, Sleeps at n+1
  Auto_Sleep_On_dc: '2.5%'  # LED Dutycycle when Auto Sleep is On
  Auto_Sleep_Off_dc: '87%'  # LED Dutycycle when Auto Sleep is Off
  ultrasonic_interval: '70ms'  # Time between ultrasonic trigger pulses
  throttle_average_duration: '15s'  # Time between TOF measurements
  skip_initial_count: '1'  # Number of initial TOF measurements to skip
  tank_size: "330"  # 275, 330, 500, 550, or 1000
  tank_orientation: '1'   # 1 = Vertical,  2 = Horizontal
  volume_calc_method: '1'  # 1 = Geometric, 2 = Table
  oil_depth_offset: '0.0'  # inches


### Tank Chart Sources ###
# https://www.fuelsnap.com/heating_oil_tank_charts.php
# https://www.highlandtank.com/wp-content/uploads/2018/10/highland_gauge_chart_book.pdf
# https://www.granbyindustries.com/wp-content/uploads/2017/04/GranbyInd_Capacity-Chart_VerticalTanks_USA_v1.pdf
# https://allamericanenviro.com/determine-residential-heating-oil-tank-size-home-oil-tank-size-chart/


esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 800
      then:
        - switch.turn_off: ultrasonic_en
    - priority: -100
      then:
        - script.execute: set_tank_dimensions
        - output.turn_on: LED_pwm
        - output.set_level:
            id: LED_pwm
            level: ${Auto_Sleep_On_dc}
        - switch.turn_on: TempSens_EN

  on_shutdown:
    - priority: 800
      then:
        - if:
            condition:
              - lambda: 'return (id(Deep_Sleep) == 1);'  # Deep_Sleep is ON
            then:
              - lambda: 'delay(50);'
              - switch.turn_on: Done

deep_sleep:
  id: my_deep_sleep
  sleep_duration: 30s

globals:
  - id: Deep_Sleep
    type: int
    initial_value: '0'

  - id: Tank_Width
    type: float
    initial_value: '0'

  - id: Tank_Radius
    type: float
    initial_value: '0'

  - id: Tank_Height
    type: float
    initial_value: '0'

  - id: Tank_Length
    type: float
    initial_value: '0'

  - id: Max_Fill
    type: double
    initial_value: '0'

  - id: Tank_Orientation
    type: float
    initial_value: ${tank_orientation}

  - id: Tank_Size
    type: float
    initial_value: ${tank_size}

  - id: Measure_Count
    type: int
    initial_value: '0'

  - id: Samples_Before_Sleep
    type: int
    initial_value: ${Samples_Before_Sleep}

  - id: Volume_Calc_Method
    type: int
    initial_value: ${volume_calc_method}

switch:

  - platform: restart
    name: Reboot

  - platform: gpio
    pin: GPIO15
    id: TempSens_EN
    name: "TempSens EN"
    entity_category: "config"
    disabled_by_default: true

  - platform: gpio
    pin: GPIO14
    id: ultrasonic_en
    name: "Ultrasonic EN"
    entity_category: "config"
    disabled_by_default: false
    on_turn_on:
      then:
        - delay: 3s
        - script.execute: ultrasonic_loop

  - platform: gpio
    pin: GPIO13  # Done Signal to TPL5111
    id: Done
    entity_category: "config"
    disabled_by_default: true
    name: "Done"

  - platform: template
    name: "Deep Sleep Trigger"
    id: deep_sleep_trig
    optimistic: true
    on_turn_on:
      then:
        - script.stop: ultrasonic_loop
        - switch.turn_off: ultrasonic_en
        - output.turn_off: LED_pwm
        - deep_sleep.enter:
            id: my_deep_sleep

  - platform: template
    name: "Auto Sleep Disable"
    id: Auto_Sleep_Disable
    optimistic: true
    on_turn_on:
      - output.set_level:
          id: LED_pwm
          level: ${Auto_Sleep_Off_dc}
    on_turn_off:
      - output.set_level:
          id: LED_pwm
          level: ${Auto_Sleep_On_dc}


output:
  - platform: slow_pwm
    id: LED_pwm
    period: 1s
    pin: GPIO2
    inverted: true


binary_sensor:
  - platform: gpio
    pin:
      number: GPIO12
      inverted: true
    id: ctrl_btn
    name: "Control Button"
    on_multi_click:
      - timing:  # Double Click
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - switch.toggle: Auto_Sleep_Disable
      - timing:  # Single Click
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - script.execute: Sleep_Trigger


sensor:

  - platform: adc
    pin: A0
    name: "ADC Input"
    id: ADC_Input
    accuracy_decimals: 3
    update_interval: 5s
    entity_category: "diagnostic"
    icon: mdi:current-dc
    filters:
      - lambda: |-
          // Battery Voltage Divider R Values
          int R1 = 10.0;  // MOhm
          int R2 = 1.0;   // MOhm

          float offset = -1.1; // Temperature correction offset (degC)

          if (id(TempSens_EN).state){
            return (((x*1000.0)-500.0)/10.0) + offset; // Temperature Sensor (degC)
          } else {
            return (x * (R1+R2))/R2; // Battery Voltage
          }
    on_value:
      then:
        - if:
            condition:
              - switch.is_on: TempSens_EN
            then:
              - sensor.template.publish:
                  id: TempC
                  state: !lambda 'return id(ADC_Input).state;'
              - switch.turn_off: TempSens_EN
              - delay: 1s
              - switch.turn_on: ultrasonic_en
            else:
              - sensor.template.publish:
                  id: BattV
                  state: !lambda 'return id(ADC_Input).state;'

  - platform: template
    name: 'Temperature'
    id: TempC
    device_class: temperature
    update_interval: never
    state_class: measurement
    accuracy_decimals: 3
    unit_of_measurement: '°C'
    on_value:
      then:
        - component.update: VP_Oil

  - platform: template
    name: 'Battery Voltage'
    id: BattV
    device_class: voltage
    state_class: measurement
    update_interval: never
    accuracy_decimals: 3
    unit_of_measurement: 'V'
    icon: mdi:current-dc
    on_value:
      then:
        - lambda: |-
            static const char *const TAG = "ADC Input";
            ESP_LOGD(TAG,
                  "Measurements:\n"
                  " TempC: %.4g C\n"
                  " BattV: %.4g V\n",
                  id(TempC).state, id(BattV).state);

  - platform: template
    name: 'Vapor Pressure Oil'
    id: VP_Oil
    update_interval: never
    device_class: pressure
    unit_of_measurement: kPa
    entity_category: "diagnostic"
    accuracy_decimals: 8
    lambda: |-
      return id(TempC).state;
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            # https://www.eng-tips.com/threads/typical-diesel-info.109718/post-424028
            # Map 0.0 (from sensor) to 1.0 (true value)
            # degC to Oil Vapor Pressure kPa
            - 4.444444444 -> 0.021373756
            - 10.0 -> 0.03102642
            - 15.55555556 -> 0.051021224
            - 21.11111111 -> 0.06205284
            - 26.66666667 -> 0.08273712
            - 32.22222222 -> 0.11031616
            - 37.77777778 -> 0.15168472
    on_value:
      then:
        - component.update: Speed_of_Sound

  - platform: template
    id: Speed_of_Sound
    name: "Speed of Sound"
    unit_of_measurement: 'm/s'
    device_class: speed
    update_interval: never
    entity_category: "diagnostic"
    lambda: |-

          // Calc Molecular Weight of Vapor above Oil

          double MW_Oil = 167.31102;  // g_Oil/mol_Oil  (C12H23)
          double MW_Air = 28.9639475;  // g_Air/mol_Air

          double P_Total = 101.325;  // kPa (Could use a measured pressure here)
          double P_Oil = id(VP_Oil).state;  // Partial Pressure of Oil kPa
          double P_Air = P_Total - P_Oil;  // Partial Pressure Of Air kPa

          double nOil_per_nTotal = P_Oil / P_Total;  // mol_Oil/mol_Total
          double nAir_per_nTotal = P_Air / P_Total;  // mol_Air/mol_Total

          double g_Oil_per_nTotal = nOil_per_nTotal * MW_Oil;  // g_Oil/mol_Total
          double g_Air_per_nTotal = nAir_per_nTotal * MW_Air;  // g_Air/mol_Total

          double MW_Total = g_Oil_per_nTotal + g_Air_per_nTotal;  // g_Total/mol_Total
          MW_Total = MW_Total / 1000.0; // kg_Total/mol_Total


          // Calc Speed of Sound in Vapor above Oil
          // https://en.wikipedia.org/wiki/Speed_of_sound
          double gamma = 1.4; // Oil is small enough fraction that large change in gamma is not expected
          double R = 8.31446261815324;
          double Sc = sqrt(gamma * R * 273.15 / MW_Total);
          double speed_sound_m_per_s = Sc * sqrt(1+(id(TempC).state/273.15));  // ideal diatomic gas

          return speed_sound_m_per_s;

  - platform: ultrasonic
    trigger_pin:
      number: GPIO4
      inverted: true
    echo_pin: GPIO5
    name: "Distance to Oil"
    id: Ultrasonic_Distance
    update_interval: never
    accuracy_decimals: 4
    unit_of_measurement: 'in'
    device_class: distance
    state_class: measurement
    disabled_by_default: false
    entity_category: "diagnostic"
    filters:
      - multiply: 100  # convert m to cm
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - throttle_average: ${throttle_average_duration}
      - skip_initial: ${skip_initial_count}

      - lambda: |-

          // x = cm as measured by ultrasonic sensor

          // Back Calc Time of Flight
          double ESP_speed_sound_m_per_s = 343.0;
          double distance_m = x / 100.0;
          double total_dist = distance_m * 2.0;
          double time_s = total_dist / ESP_speed_sound_m_per_s;
          double time_ms = time_s * 1000.0;

          // Calc Distance to Oil Surface
          double total_dist_m = time_s * id(Speed_of_Sound).state;
          double Oil_Distance = (total_dist_m / 2.0) * 100.0;  // cm

          Oil_Distance = Oil_Distance * 10 /25.4; // cm to inches

          static const char *const TAG = "Ultrasonic";
          ESP_LOGD(TAG,
                    "Speed Corrected:\n"
                    " Time of Flight %.4g ms\n"
                    " Distance to Oil %.4g inches\n",
                    time_ms, Oil_Distance);

          return Oil_Distance;

    on_value:
      then:
        - script.execute: Sleep_Check
        - sensor.template.publish:
            id: Raw_Oil_Depth
            state: !lambda 'return x;'

  - platform: template
    id: Raw_Oil_Depth
    name: "Raw Oil Depth"
    unit_of_measurement: 'in'
    device_class: distance
    state_class: measurement
    update_interval: never
    icon: mdi:arrow-expand-vertical
    accuracy_decimals: 4
    entity_category: "diagnostic"
    filters:
      - sliding_window_moving_average:
          window_size: ${Samples_Before_Sleep}
          send_every: ${Samples_Before_Sleep}
          send_first_at: ${Samples_Before_Sleep}

      - lambda: |-

          // x = speed corrected inches to oil

          double Oil_Distance = x;  // inches
          double Raw_Oil_Depth;

          if (id(Tank_Orientation) == 1){  // Vertical
            Raw_Oil_Depth = id(Tank_Height) - Oil_Distance;
          } else {  // Horizontal
            Raw_Oil_Depth = id(Tank_Width) - Oil_Distance;
          }

          return Raw_Oil_Depth;  // inches
    on_value:
      then:
        - sensor.template.publish:
            id: Oil_Depth
            state: !lambda 'return x;'

  - platform: template
    id: Oil_Depth
    name: "Oil Depth"
    unit_of_measurement: 'in'
    device_class: distance
    state_class: measurement
    update_interval: never
    icon: mdi:arrow-expand-vertical
    accuracy_decimals: 4
    entity_category: "diagnostic"
    filters:
      - offset: ${oil_depth_offset}
    on_value:
      then:
        - if:
            condition:
              - lambda: 'return (id(Volume_Calc_Method) == 1);'  # Geometric
            then:
              - sensor.template.publish:
                  id: Oil_Volume_Geo
                  state: !lambda 'return x;'
        - if:
            condition:
              - lambda: 'return (id(Volume_Calc_Method) == 2);'  # Table
            then:
              - if:
                  condition:
                    - lambda: 'return (id(Tank_Size) == 500);'
                  then:
                    - sensor.template.publish:
                        id: Oil_Volume_Table_500
                        state: !lambda 'return x;'
              - if:
                  condition:
                    - lambda: 'return (id(Tank_Size) == 550);'
                  then:
                    - sensor.template.publish:
                        id: Oil_Volume_Table_550
                        state: !lambda 'return x;'
              - if:
                  condition:
                    - lambda: 'return (id(Tank_Size) == 1000);'
                  then:
                    - sensor.template.publish:
                        id: Oil_Volume_Table_1000
                        state: !lambda 'return x;'
              - if:
                  condition:
                    - lambda: 'return id(Tank_Orientation) == 1;'  # Vertical
                  then:
                    - if:
                        condition:
                          - lambda: 'return (id(Tank_Size) == 330);'
                        then:
                          - sensor.template.publish:
                              id: Oil_Volume_Table_330V
                              state: !lambda 'return x;'
                    - if:
                        condition:
                          - lambda: 'return (id(Tank_Size) == 275);'
                        then:
                          - sensor.template.publish:
                              id: Oil_Volume_Table_275V
                              state: !lambda 'return x;'
                  else:  # Horizontal
                    - if:
                        condition:
                          - lambda: 'return (id(Tank_Size) == 330);'
                        then:
                          - sensor.template.publish:
                              id: Oil_Volume_Table_330H
                              state: !lambda 'return x;'
                    - if:
                        condition:
                          - lambda: 'return (id(Tank_Size) == 275);'
                        then:
                          - sensor.template.publish:
                              id: Oil_Volume_Table_275H
                              state: !lambda 'return x;'

  - platform: template
    id: Oil_Volume_Geo
    name: 'Oil Volume Geo'
    unit_of_measurement: 'in²'
    update_interval: never
    device_class: volume_storage
    entity_category: "diagnostic"
    internal: true
    filters:
      - lambda: |-
          // Calculate the Oil Area

          double Oil_Depth_in = x;  // inches

          // Calculate Rectangle and Arc Heights

          double Oil_Height = x;  // Inches
          double Rectangle_Height = 0.0;
          double Arc_Height = 0.0;

          if (id(Tank_Orientation) == 2){  // Horizontal

            Rectangle_Height = Oil_Height;
            Arc_Height = Oil_Height;

          } else {  // Vertical

            if (Oil_Height >= (id(Tank_Height) - id(Tank_Radius))) {
              Rectangle_Height = id(Tank_Height) - id(Tank_Width);
              Arc_Height = Oil_Height - Rectangle_Height;
            }

            if ((Oil_Height >= id(Tank_Radius))&&(Oil_Height < (id(Tank_Height) - id(Tank_Radius)))) {
              Rectangle_Height = Oil_Height - id(Tank_Radius);
              Arc_Height = id(Tank_Radius);
            }

            if ((Oil_Height >= 0)&&(Oil_Height < id(Tank_Radius))){
              Rectangle_Height = 0;
              Arc_Height = Oil_Height;
            }

            if (Oil_Height < 0){
              Rectangle_Height = 0;
              Arc_Height = 0;
            }
          }

          // Calculate Arc Area

          double Arc_Area;

          double d;
          double r;
          double arc;

          d = Arc_Height;
          r = id(Tank_Radius);
          arc = 2 * (acos((r-d)/r));
          Arc_Area = ((r*r) * (arc - sin(arc))) / 2;

          // Calculate Rectangle Area
          double Rectangle_Area;

          if (id(Tank_Orientation) == 1){  // Vertical
            Rectangle_Area = Rectangle_Height * id(Tank_Width);
          } else {  // Horizontal
            Rectangle_Area = Rectangle_Height * (id(Tank_Height) - id(Tank_Width));
          }

          double Oil_Area_Geo =  Rectangle_Area + Arc_Area;  // Total Area in²

          const char* TAG = "Geometric Oil Area";
          ESP_LOGV(TAG,
                  "Calculations:\n"
                  " Tank Orientation %g\n"
                  " Tank Size %g\n"
                  " Tank Width %.4g\n"
                  " Tank Height %.4g\n"
                  " Tank Length %.4g\n"
                  " Tank Radius %.4g\n"
                  " Oil Height %.4g\n"
                  " Arc Height %.4g\n"
                  " Rectangle Height %.4g\n"
                  " Arc Area %.4g\n"
                  " Rectangle Area %.4g\n"
                  " Oil Area Geo %.4g\n",
                  id(Tank_Orientation), id(Tank_Size), id(Tank_Width),
                  id(Tank_Height), id(Tank_Length), id(Tank_Radius),
                  Oil_Height, Arc_Height, Rectangle_Height, Arc_Area,
                  Rectangle_Area, Oil_Area_Geo);

          // Calculate Oil Volume in Tank

          return Oil_Area_Geo * id(Tank_Length) / 231; // gallons

    on_value:
      then:
        - sensor.template.publish:
            id: Oil_Volume
            state: !lambda 'return x;'

