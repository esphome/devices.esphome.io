    unit_of_measurement: 'gal'
    update_interval: never
    device_class: volume_storage
    state_class: measurement
    accuracy_decimals: 4
    on_value:
      then:
        - lambda: |-
            const char* TAG = "Oil Volume";
            ESP_LOGD(TAG,
                    "Results:\n"
                    " Raw Oil Depth %.5g inches\n"
                    " Oil Depth %.5g inches\n"
                    " Oil in Tank %.5g gallons\n",
                    id(Raw_Oil_Depth).state, id(Oil_Depth).state, x);
        - sensor.template.publish:
            id: Max_Refill_Volume
            state: !lambda 'return x;'

  - platform: template
    id: Max_Refill_Volume
    name: "Max Fill"
    unit_of_measurement: 'gal'
    device_class: volume
    state_class: total
    update_interval: never
    accuracy_decimals: 4
    filters:
      - lambda: |-
          // x = Oil Volume in Tank gallons
          double Max_Refill = id(Max_Fill) - x;
          return Max_Refill;


script:
  - id: ultrasonic_loop
    mode: restart
    then:
      - delay: ${ultrasonic_interval}
      - while:
          condition:
            switch.is_on: ultrasonic_en
          then:
            - component.update: Ultrasonic_Distance  # Oil_In_Tank
            - delay: ${ultrasonic_interval}

  - id: Sleep_Check
    then:
      - if:
          condition:
            - switch.is_on: Auto_Sleep_Disable
          then:
            - globals.set:
                id: Measure_Count
                value: '0'
          else:
            - globals.set:
                id: Measure_Count
                value: !lambda 'return id(Measure_Count) += 1;'
            - if:
                condition:
                  - lambda: 'return id(Measure_Count) > (id(Samples_Before_Sleep));'
                then:
                  - script.execute: Sleep_Trigger
      - lambda: |-

          static const char *const TAG = "Sleep Check";
          ESP_LOGD(TAG,
                    " Auto Sleep Disable %i\n"
                    " MeasureCount %i\n",
                    id(Auto_Sleep_Disable).state,id(Measure_Count));

  - id: Sleep_Trigger
    then:
      - script.stop: ultrasonic_loop
      - switch.turn_off: ultrasonic_en
      - output.turn_off: LED_pwm
      - lambda: '(id(Deep_Sleep) = 1);'  # Turn ON Deep_Sleep
      - deep_sleep.enter:
          id: my_deep_sleep

  - id: set_tank_dimensions
    then:
      - lambda: |-
          if (id(Tank_Size) == 275){
              id(Max_Fill) = 250.0;
              id(Tank_Width) = 27.8;
              id(Tank_Height) = 44.0;
              id(Tank_Length) = 60.0;
          }
          if (id(Tank_Size) == 330){
              id(Max_Fill) = 300.0;
              id(Tank_Width) = 27.8;
              id(Tank_Height) = 44.0;
              id(Tank_Length) = 72;
          }
          if (id(Tank_Size) == 500){
              id(Max_Fill) = 450.0;
              id(Tank_Width) = 48.0;
              id(Tank_Height) = 48.0;
              id(Tank_Length) = 63.8;
          }
          if (id(Tank_Size) == 550){
              id(Max_Fill) = 500.0;
              id(Tank_Width) = 48.0;
              id(Tank_Height) = 48.0;
              id(Tank_Length) = 70.25;
          }
          if (id(Tank_Size) == 1000){
              id(Max_Fill) = 900.0;
              id(Tank_Width) = 48.0;
              id(Tank_Height) = 48.0;
              id(Tank_Length) = 127.6;
          }

          id(Tank_Radius) = id(Tank_Width)/2.0;
