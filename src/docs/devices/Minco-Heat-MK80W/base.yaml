# Advanced templates, calibration logic and HA UI entities
captive_portal:

text:
  - platform: template
    id: ntp_server_address
    name: "Thermostat NTP Server"
    mode: TEXT
    optimistic: true
    initial_value: "192.168.1.200"
    restore_value: true
    on_value:
      - then:
          - lambda: >-
              ESP_LOGW("ntp_config", "New NTP address: %s", x.c_str());

interval:
  - interval: 30min
    then:
      - if:
          condition:
            - time.has_time:
                id: ntp_time
          then:
            - lambda: |-
                ESP_LOGI("version_control", "--- BUILD STATE: v42.0 ---");
                std::string current_ntp = id(ntp_server_address).state;
                ESP_LOGI("custom_net", "Active NTP server: %s",
                         current_ntp.c_str());

select:
  - platform: template
    name: "Thermostat Mode"
    id: custom_thermo_mode
    optimistic: true
    options:
      - "Auto (Schedule)"
      - "Manual"
      - "ECO Mode (Leaf)"
    on_value:
      - lambda: |-
          uint8_t raw_val = 1;
          if (x == "Auto (Schedule)") raw_val = 0;
          if (x == "ECO Mode (Leaf)") raw_val = 2;
          uint8_t packet[] = {
            0x55, 0xAA, 0x00, 0x06, 0x00, 0x05,
            2, 0x01, 0x00, 0x01, raw_val, 0x00
          };
          uint8_t cs = 0;
          for (size_t i = 0; i < (sizeof(packet) - 1); i++) {
            cs += packet[i];
          }
          packet[sizeof(packet) - 1] = cs;
          id(tuya_uart).write_array(packet, sizeof(packet));

number:
  - platform: template
    name: "Thermostat Max Limit"
    id: text_max_limit
    min_value: 20.0
    max_value: 50.0
    step: 0.5
    unit_of_measurement: "°C"
    optimistic: true
    initial_value: 33.0
    on_value:
      - lambda: |-
          int32_t raw_val = (int32_t)(x * 10);
          uint8_t packet[] = {
            0x55, 0xAA, 0x00, 0x06, 0x00, 0x08,
            19, 0x02, 0x00, 0x04,
            (uint8_t)(raw_val >> 24), (uint8_t)(raw_val >> 16),
            (uint8_t)(raw_val >> 8), (uint8_t)(raw_val & 0xFF), 0x00
          };
          uint8_t cs = 0;
          for (size_t i = 0; i < (sizeof(packet) - 1); i++) {
            cs += packet[i];
          }
          packet[sizeof(packet) - 1] = cs;
          id(tuya_uart).write_array(packet, sizeof(packet));

  - platform: template
    name: "Thermostat Min Limit"
    id: text_min_limit
    min_value: 5.0
    max_value: 20.0
    step: 0.5
    unit_of_measurement: "°C"
    optimistic: true
    initial_value: 18.0
    on_value:
      - lambda: |-
          int32_t raw_val = (int32_t)(x * 10);
          uint8_t packet[] = {
            0x55, 0xAA, 0x00, 0x06, 0x00, 0x08,
            26, 0x02, 0x00, 0x04,
            (uint8_t)(raw_val >> 24), (uint8_t)(raw_val >> 16),
            (uint8_t)(raw_val >> 8), (uint8_t)(raw_val & 0xFF), 0x00
          };
          uint8_t cs = 0;
          for (size_t i = 0; i < (sizeof(packet) - 1); i++) {
            cs += packet[i];
          }
          packet[sizeof(packet) - 1] = cs;
          id(tuya_uart).write_array(packet, sizeof(packet));

  - platform: template
    name: "Thermostat Calibration"
    id: text_calibration
    min_value: -9.0
    max_value: 9.0
    step: 1.0
    unit_of_measurement: "°C"
    optimistic: true
    initial_value: 0.0
    on_value:
      - lambda: |-
          int32_t raw_val = 4 - (int32_t)(x);
          uint8_t packet[] = {
            0x55, 0xAA, 0x00, 0x06, 0x00, 0x08,
            27, 0x02, 0x00, 0x04,
            (uint8_t)(raw_val >> 24), (uint8_t)(raw_val >> 16),
            (uint8_t)(raw_val >> 8), (uint8_t)(raw_val & 0xFF), 0x00
          };
          uint8_t cs = 0;
          for (size_t i = 0; i < (sizeof(packet) - 1); i++) {
            cs += packet[i];
          }
          packet[sizeof(packet) - 1] = cs;
          id(tuya_uart).write_array(packet, sizeof(packet));
