substitutions:
  devicename: loetad_eu3s_plug_1
  friendly_name: Loetad EU3S Plug 1
  device_description: Loetad EU3S Power Monitoring Plug with button and Blue led.
  current_res: "0.00221"  # Random value. Requires power monitoring calibration
  voltage_div: "955"  # Random value. Requires power monitoring calibration

esphome:
  name: ${devicename}
  comment: ${device_description}

esp8266:
  board: esp01_1m

wifi:
  ap:

# Enable logging
logger:

sensor:
  # Reports how long the device has been powered (in minutes)
  - platform: uptime
    name: ${friendly_name} Uptime
    filters:
      - lambda: return x / 60.0;
    unit_of_measurement: minutes

  # Reports the WiFi signal strength
  - platform: wifi_signal
    name: ${friendly_name} Wifi Signal
    update_interval: 60s

  # Reports the Current, Voltage, and Power used by the plugged-in device
  - platform: hlw8012
    sel_pin:
      number: GPIO12
      inverted: true
    cf_pin: GPIO05
    cf1_pin: GPIO14
    change_mode_every: 8
    update_interval: 10s
    current:
      name: ${friendly_name} Amperage
      icon: mdi:current-ac
      unit_of_measurement: A
    voltage:
      name: ${friendly_name} Voltage
      icon: mdi:flash-circle
      unit_of_measurement: V
    power:
      id: wattage
      name: ${friendly_name} Wattage
      icon: mdi:flash-outline
      unit_of_measurement: W
    current_resistor: ${current_res}
    voltage_divider: ${voltage_div}

binary_sensor:
  # Button on the front is pressed and then toggle relay
  - platform: gpio
    device_class: power
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    name: ${friendly_name} Button  # Name to make button visible in HA
    on_press:
      - switch.toggle: relay

text_sensor:
  # Reports the ESPHome Version with compile date
  - platform: version
    name: ${friendly_name} ESPHome Version

  # Reports detailed wifi info, can be commented out
  - platform: wifi_info
    ip_address:
      name: ${friendly_name} IP Address

switch:
  # Relay itself
  - platform: gpio
    name: ${friendly_name}
    pin: GPIO15
    id: relay
    restore_mode: RESTORE_DEFAULT_OFF  # Try to restore relay state after reboot/power-loss.
    # RESTORE_DEFAULT_OFF (Default) - Attempt to restore state and default to
    # OFF if not possible to restore. Uses flash write cycles.
    # RESTORE_DEFAULT_ON - Attempt to restore state and default to ON.
    # Uses flash write cycles.
    # ALWAYS_OFF - Always initialize the pin as OFF on bootup.
    # Does not use flash write cycles.
    # ALWAYS_ON - Always initialize the pin as ON on bootup.
    # Does not use flash write cycles.
    on_turn_on:  # Action when relay is turned on
      - script.execute: led_power_on
    on_turn_off:  # Action when relay is turned off
      - script.execute: led_relay_off

output:
  # Output GPIOs for blue led
  - platform: esp8266_pwm  # Blue
    id: ${devicename}_blue_output
    pin:
      number: GPIO02
      inverted: true

light:
  # RGB light
  - platform: monochromatic
    name: ${friendly_name} Light
    output: ${devicename}_blue_output
    id: ${devicename}_blue_led

# Blink the blue light if we aren't connected to WiFi. The status LED
# component is another option, but would prevent using the blue light for
# other purposes.
# Only if not connected after 30s
interval:
  - interval: 2000ms
    then:
      - if:
          condition:
            for:
              time: 30s
              condition:
                not:
                  wifi.connected:
          then:
            - light.turn_on:
                id: ${devicename}_blue_led
                brightness: 100%

script:
  - id: led_relay_off  # Normal operation when relay is off
    then:
      - light.turn_off:
          id: ${devicename}_blue_led
  - id: led_power_on  # Normal operation when relay is on
    then:
      - light.turn_on:
          id: ${devicename}_blue_led
          brightness: 80%
