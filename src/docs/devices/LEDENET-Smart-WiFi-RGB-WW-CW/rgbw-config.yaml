substitutions:
  device_name: "magichome5ch"
  friendly_name: "Magic Home RGB/WW/CW"

esphome:
  name: ${device_name}

esp8266:
  board: esp8285

wifi:
  ap: {}
logger:
status_led:
  pin:
    number: GPIO2
    inverted: true

binary_sensor:
  - platform: gpio
    name: "${device_name} Reset Button"
    id: button
    pin:
      number: GPIO0
      inverted: true

light:
  - platform: rgbw
    name: ${friendly_name}
    id: ${device_name}
    red: red_channel
    green: green_channel
    blue: blue_channel
    white: cold_white_channel
    color_interlock: true

output:
  - platform: esp8266_pwm
    id: red_channel
    pin: GPIO14
  - platform: esp8266_pwm
    id: green_channel
    pin: GPIO12
  - platform: esp8266_pwm
    id: blue_channel
    pin: GPIO13
  - platform: esp8266_pwm
    id: cold_white_channel
    pin: GPIO5
  - platform: esp8266_pwm
    id: warm_white_channel
    pin: GPIO15
